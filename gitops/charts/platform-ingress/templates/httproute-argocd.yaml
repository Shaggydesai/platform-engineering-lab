{{- if .Values.routes.argocd.enabled }}
# Argo CD's own UI, on the platform Gateway.
#
# Two things about where this object lives, both deliberate (ADR-0014).
#
# It is in the ARGOCD namespace, not in this chart's namespace. A backendRef that crosses
# namespaces needs a ReferenceGrant in the target namespace permitting it; a Route that sits
# beside its backend does not. Putting the route with the application is also how a real platform
# works - the app team owns its route, the platform team owns the Gateway.
#
# Its parentRef DOES cross namespaces, pointing at the Gateway in platform-ingress. That is
# allowed because the Gateway's listeners say allowedRoutes.namespaces.from: All. These are two
# different permissions and conflating them is the usual Gateway API confusion:
#
#   allowedRoutes (on the Gateway)  - who may ATTACH a route to this listener.
#   ReferenceGrant (in the backend's namespace) - who may POINT AT a backend here.
#
# So this file needs the first and not the second, and a route whose backend lived elsewhere
# would need both.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # Wave 2: after the Gateway in wave 1. A route attached to a Gateway that does not exist yet
    # is accepted and sits with Accepted=False, reason NoMatchingParent - which recovers on the
    # next sync and teaches nothing.
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: {{ .Values.routes.argocd.gatewayName | quote }}
      namespace: {{ .Values.routes.argocd.gatewayNamespace | quote }}
      # Pin the listener by name. Without sectionName the route attaches to EVERY compatible
      # listener, which here means it would also answer on plain HTTP port 80 - silently serving
      # the Argo CD login page unencrypted on the same address.
      sectionName: https

  hostnames:
    - {{ .Values.routes.argocd.hostname | quote }}

  rules:
    - backendRefs:
        - name: {{ .Values.routes.argocd.serviceName | quote }}
          # Port 80, not 443. argocd-values.yaml sets server.insecure: true, so argocd-server
          # serves plain HTTP and the Gateway is what terminates TLS. Pointing at 443 would mean
          # the Gateway re-encrypting to a certificate argocd-server self-signed, which it would
          # then refuse to verify.
          port: {{ .Values.routes.argocd.servicePort }}
{{- end }}
