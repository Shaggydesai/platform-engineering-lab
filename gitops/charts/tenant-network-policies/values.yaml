# Defaults are OFF and EMPTY. A network policy applied to the wrong namespace either does nothing
# or breaks an application, and neither failure announces itself - so this chart renders nothing
# until an environment overlay says who it is for.

tenant:
  enabled: false
  # The namespace to police, and the Helm release label its pods carry.
  namespace: ""
  instance: ""

# Which pods may reach the database, BY NAME rather than "any pod in the release".
#
# The names below are not a guess: Hubble was asked what actually connects to MongoDB over a full
# checkout, and it saw exactly these five. frontend and api-gateway never do, which the chart's
# own env wiring also implies - the api-gateway proxies HTTP and holds no database connection.
#
# A policy that allows "every pod of this release" would permit a compromised frontend to read
# every order in the database. This one does not, and that difference is the entire point of
# writing it from an observed graph instead of from the deployment's convenience.
database:
  enabled: false
  # The pod label value for the database itself.
  name: mongodb
  port: 27017
  clients:
    - user-service
    - product-service
    - cart-service
    - order-service
    - payment-service

# Everything the tenant may talk to. OFF by default, like the rest of this chart.
#
# The DNS values DO carry defaults, which is a deliberate exception to "defaults are off and
# empty" above. `kube-system` / `k8s-app=kube-dns` is what kubeadm installs CoreDNS as and what
# GKE and EKS use too, so it is not a per-substrate choice - and the consequence of getting it
# wrong is not a policy that does nothing, it is a namespace where no name resolves. A default
# that is correct everywhere is safer here than a blank that someone fills in from memory.
#
# The template still FAILS if either is explicitly emptied, because `dns: {}` is a thing someone
# writes while debugging and then commits.
egress:
  enabled: false

  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
    # 53 renders as both UDP and TCP. TCP is not optional: a response larger than 512 bytes, or
    # any query over a resolver that chooses TCP, falls back to it - so a UDP-only rule produces
    # resolution that works for most names and fails for some, which is worse than failing for
    # all of them.
    ports: [53]

  # The tenant's own service graph. This does NOT grant database access - the database's ingress
  # policy still lists five pods by name, and both directions must allow a connection.
  allowSameNamespace: true

  # Destinations outside the cluster, each with a reason. Empty because ShopVerse has none: no
  # payment gateway, no SMTP, no external API. That is what makes default-deny possible here
  # without a list to maintain, and it is not typical of a real tenant.
  #
  #   allowCidrs:
  #     - cidr: 203.0.113.0/24
  #       ports: [{protocol: TCP, port: 443}]
  allowCidrs: []
