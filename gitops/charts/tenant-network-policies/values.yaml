# Defaults are OFF and EMPTY. A network policy applied to the wrong namespace either does nothing
# or breaks an application, and neither failure announces itself - so this chart renders nothing
# until an environment overlay says who it is for.

tenant:
  enabled: false
  # The namespace to police, and the Helm release label its pods carry.
  namespace: ""
  instance: ""

# Which pods may reach the database, BY NAME rather than "any pod in the release".
#
# The names below are not a guess: Hubble was asked what actually connects to MongoDB over a full
# checkout, and it saw exactly these five. frontend and api-gateway never do, which the chart's
# own env wiring also implies - the api-gateway proxies HTTP and holds no database connection.
#
# A policy that allows "every pod of this release" would permit a compromised frontend to read
# every order in the database. This one does not, and that difference is the entire point of
# writing it from an observed graph instead of from the deployment's convenience.
database:
  enabled: false
  # The pod label value for the database itself.
  name: mongodb
  port: 27017
  clients:
    - user-service
    - product-service
    - cart-service
    - order-service
    - payment-service

# Everything the tenant may talk to. OFF by default, like the rest of this chart.
#
# The DNS values DO carry defaults, which is a deliberate exception to "defaults are off and
# empty" above. `kube-system` / `k8s-app=kube-dns` is what kubeadm installs CoreDNS as and what
# GKE and EKS use too, so it is not a per-substrate choice - and the consequence of getting it
# wrong is not a policy that does nothing, it is a namespace where no name resolves. A default
# that is correct everywhere is safer here than a blank that someone fills in from memory.
#
# The template still FAILS if either is explicitly emptied, because `dns: {}` is a thing someone
# writes while debugging and then commits.
egress:
  enabled: false

  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
    # 53 renders as both UDP and TCP. TCP is not optional: a response larger than 512 bytes, or
    # any query over a resolver that chooses TCP, falls back to it - so a UDP-only rule produces
    # resolution that works for most names and fails for some, which is worse than failing for
    # all of them.
    ports: [53]

  # The tenant's own service graph. This does NOT grant database access - the database's ingress
  # policy still lists five pods by name, and both directions must allow a connection.
  allowSameNamespace: true

  # Destinations outside the cluster, each with a reason. Empty because ShopVerse has none: no
  # payment gateway, no SMTP, no external API. That is what makes default-deny possible here
  # without a list to maintain, and it is not typical of a real tenant.
  #
  #   allowCidrs:
  #     - cidr: 203.0.113.0/24
  #       ports: [{protocol: TCP, port: 443}]
  allowCidrs: []

# Who may reach the tenant's front door. OFF by default, and the only CiliumNetworkPolicy here.
#
# `fromEntities` carries BOTH host and remote-node, and the second one is the whole reason this
# rule was hard. The L2 announcement lease (ADR-0013) elects one node to answer ARP for the
# Gateway's address and that election MOVES on a node failure - so the Envoy proxying into the
# frontend is sometimes on the frontend's own node (host) and sometimes not (remote-node). A rule
# listing only `host` passes every test you can run while the lease happens to sit on the right
# node, and starts refusing the front door about 15 seconds after an unrelated node dies.
#
# `make ingress-failover-check` moves the lease deliberately and proves the rule survives it.
frontendIngress:
  enabled: false

  # The pod label value for the front door. On-prem this is the only backend the Gateway routes
  # to - the HTTPRoute sends shopverse.platform.local to shopverse-frontend:8080, and the
  # frontend proxies /api onwards inside the namespace, so api-gateway never receives external
  # traffic and must not be listed here.
  name: frontend

  # THREE ENTITIES, and the first one is here because the first version of this rule was WRONG
  # and the application returned 503 (2026-11-05). Read off a live flow with Hubble rather than
  # reasoned about, which is how it should have been written the first time:
  #
  #   10.244.1.207:39652 (ingress) <> shopverse-frontend:8080  policy-verdict:none INGRESS DENIED
  #   10.244.1.207:35180 (host)     -> shopverse-frontend:8080  policy-verdict:L3-L4 ALLOWED
  #
  # SAME SOURCE ADDRESS, TWO DIFFERENT IDENTITIES, and that is the whole trap. 10.244.1.207 is
  # the node's cilium_host address, and traffic from it carries:
  #
  #   ingress      Cilium's Gateway/Ingress Envoy proxy - the front door. REQUIRED, and the one
  #                that was missing. Cilium gives its L7 ingress proxy its own reserved identity
  #                rather than the host's.
  #   host         the kubelet's liveness and readiness probes, from the local node. The parking
  #                lot recorded `10.244.1.207 (host) -> frontend:8080` as the Gateway's traffic
  #                and it was not - it was a PROBE, on the same address, under a different
  #                identity. An observation of the right IP and the wrong flow.
  #   remote-node  REMOVED 2026-11-05 after being measured rather than reasoned about. It was
  #                carried as a hedge in case the Envoy presented as a remote node when it ran
  #                somewhere other than the backend. `make ingress-failover-check` put the
  #                announcer on k8s-w02 with the frontend on k8s-w01 and read the identities
  #                actually arriving: `host ingress`. The proxy keeps its own identity wherever
  #                it runs, so that entity never matched anything.
  #
  #                And it was not free: `remote-node` permits ANY node to open 8080 on the
  #                frontend, not just the ingress proxy. So removing it is a tightening, not
  #                tidying - and a clause nothing ever matches is a clause nobody can reason
  #                about a month later, which is how `[host, remote-node]` survived review in
  #                the first place.
  fromEntities:
    - ingress
    - host

  ports:
    - port: 8080
      protocol: TCP
