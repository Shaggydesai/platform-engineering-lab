{{- if .Values.secretStore.enabled }}
{{- if not .Values.secretStore.name }}{{ fail "secretStore.name is required" }}{{ end }}
{{- if not .Values.secretStore.provider }}
{{- fail "secretStore.provider is required and must come from the environment overlay - see gitops/environments/onprem/external-secrets.yaml" }}
{{- end }}
# The one object in ADR-0018's design that differs per substrate.
#
# CLUSTER-scoped on purpose, and the consequence is worth stating plainly rather than discovering
# later: a ClusterSecretStore authenticates to the backend as ONE identity - ESO's own service
# account - on behalf of every namespace. So Vault's policy is the boundary for the whole cluster,
# not per tenant. What stops ShopVerse from reading another tenant's secret is that no
# ExternalSecret asking for it exists, plus the fact that a tenant cannot create one pointing
# anywhere it likes without a platform-side policy change.
#
# A per-namespace SecretStore with a per-tenant Vault role is the stronger arrangement and is the
# right answer at two tenants. It is not built here because one tenant does not justify it, and
# writing that down is better than implying an isolation that is not present.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  annotations:
    # Wave 1: AFTER the operator and its CRDs, which land in wave 0 with everything else the
    # subchart renders. Argo CD sorts by kind within a wave and puts CustomResourceDefinition
    # early, so this would probably work without the annotation - "probably" being the reason it
    # is here. A CR applied before its CRD fails the whole sync, and the error names the kind
    # rather than the ordering.
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    {{- toYaml .Values.secretStore.provider | nindent 4 }}
{{- end }}
