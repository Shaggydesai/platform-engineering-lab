# Wrapper chart for metrics-server. ADR-0010 defines this shape.
#
# No templates of its own: metrics-server needs nothing the upstream chart does not provide.
# A wrapper chart that accumulates templates is a fork with extra steps.
#
# After changing the dependency version:  make gitops-lock
apiVersion: v2
name: metrics-server
description: >-
  metrics-server for the platform. Provides the resource metrics API, which is what
  `kubectl top` reads and what a HorizontalPodAutoscaler needs in order to exist.
type: application

# The WRAPPER's version, ours. Bumped when our values change in a way worth noticing.
version: 0.1.0

dependencies:
  - name: metrics-server
    # Pinned. CHART 3.14.0 carries metrics-server 0.9.0 - two different numbers, as with the
    # Argo CD pin, and `helm search repo metrics-server/metrics-server --versions` prints them
    # side by side. Move this in its own commit with the reason.
    #
    # My first guess here was 3.13.0, which does not exist at all (3.13.1 does). Worth
    # remembering: a version that looks plausible is not a version that resolves, and the
    # failure arrives later, from Argo CD's repo-server, as a chart it cannot find.
    version: 3.14.0
    repository: https://kubernetes-sigs.github.io/metrics-server/
