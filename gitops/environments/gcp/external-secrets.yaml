# External Secrets, gcp. The operator is the SAME; only the backend changes.
#
# This file is ADR-0018's deciding argument in its most concrete form. Compare it to the on-prem
# overlay: the chart is identical, the operator is identical, and every ExternalSecret the tenant
# writes is identical. What differs is twelve lines of provider.
#
# Inert until there is an Application in gitops/clusters/gcp/ to read it, which is Module 09.
secretStore:
  enabled: true
  name: vault-backend
  provider:
    # Deliberately still named `vault-backend`, which is now a lie about the implementation and
    # the truth about the contract. Every ExternalSecret in this repository - including the ones
    # inside ShopVerse's own chart, which this platform does not control - names that store. A
    # store called `gcpsm-backend` here would mean the tenant's manifest is not portable after
    # all, and portability was the entire reason for choosing this option.
    #
    # The name is an interface. Renaming it to match the implementation would be the mistake.
    gcpsm:
      projectID: "" # set by Module 09, from terraform output

      # Workload Identity: the GKE service account is annotated with a Google service account,
      # and GCP trusts the cluster's OIDC issuer directly. No token review, no Vault role, no
      # unseal key - and NO shared secret anywhere in the chain.
      #
      # Which is the honest comparison to make with on-prem, and it is not flattering to the
      # laptop: the hardest problem in the on-prem design (an irreducible key that a human holds
      # and re-enters after every restart) does not exist here, because Google's KMS has a
      # hardware root of trust and a laptop does not.
      auth:
        workloadIdentity:
          clusterLocation: "" # zone, not region - ADR-0003 forbids regional clusters
          clusterName: ""
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
