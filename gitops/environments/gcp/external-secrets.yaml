# External Secrets, gcp. The operator is the SAME; only the backend changes.
#
# This file is ADR-0018's deciding argument in its most concrete form. Compare it to the on-prem
# overlay: the chart is identical, the operator is identical, and every ExternalSecret the tenant
# writes is identical. What differs is the provider block, and one value in the tenant's overlay.
#
# THE CLAIM IS NOW CHECKED RATHER THAN HOPED, because the tenant's manifest turned out to say
# something specific. ShopVerse's chart (helm/shopverse/templates/externalsecret.yaml, in the
# application's own repository, which this platform does not control) renders:
#
#     data:
#       - secretKey: jwt-secret
#         remoteRef:
#           key:      {{ .Values.externalSecret.remoteKey }}
#           property: jwt-secret
#       ... six times, over a hardcoded list of the six names
#
# ONE remote key, six `property` lookups. On Vault that reads one KV v2 path and picks fields out
# of the object stored there. On Secret Manager the gcpsm provider JSON-parses the payload and
# does exactly the same. So the tenant's object is structurally identical and ONE value differs:
#
#     on-prem   remoteKey: shopverse/prod      a Vault path
#     gcp       remoteKey: shopverse-prod      a Secret Manager secret ID
#
# The slash is the whole difference, and it is forced: Secret Manager secret IDs match
# [A-Za-z0-9_-]+ and forbid the hierarchy separator Vault's paths are built from. That single
# character is the only place these two backends' addressing is visibly incompatible - which is a
# better result than ADR-0018 claimed, and it is the reason `remoteKey` had to be a Helm value
# rather than a constant in the chart.
#
# It is also what keeps this free: ONE secret with one version, not six secrets. Secret Manager
# gives six active versions free and bills $0.06 per version per month after that, so the
# six-secret arrangement would have spent the entire allowance and put a standing charge on the
# first rotation - which ADR-0003 forbids however small.

# ------------------------------------------------------------------ the operator's identity
external-secrets:
  serviceAccount:
    # WORKLOAD IDENTITY, and this annotation is the entire credential.
    #
    # There is no key file. The Kubernetes service account's projected token is exchanged with
    # Google's metadata server for a token for the Google service account named here, and GCP
    # trusts the cluster's OIDC issuer directly - which is what
    # terraform/gcp/secrets/main.tf's workloadIdentityUser binding authorises.
    #
    # Worth comparing against the on-prem overlay beside this one, which needs a Vault server
    # address, a KV mount, an API version, an auth mount path, a Vault role, and a service
    # account reference - plus a Vault that something has to unseal after every restart. Here
    # the chain is: this annotation, and a binding.
    #
    # THE VALUE IS HARDCODED AND CHECKED. Argo CD reads this file as a static YAML and cannot
    # template it, so the project ID cannot come from clusters/gcp/cluster.json at render time.
    # `make lint` asserts that this string, the project in cluster.json, and the service account
    # Terraform creates all agree - the same arrangement as the on-prem load-balancer addresses,
    # which are also duplicated and also checked. A duplicated value with a check is a different
    # thing from a duplicated value without one.
    annotations:
      iam.gke.io/gcp-service-account: external-secrets@platform-eng-lab-261031.iam.gserviceaccount.com

# ------------------------------------------------------------------ where secrets come from
secretStore:
  enabled: true
  name: vault-backend
  provider:
    # Deliberately still named `vault-backend`, which is now a lie about the implementation and
    # the truth about the contract. Every ExternalSecret in this repository - including the ones
    # inside ShopVerse's own chart, which this platform does not control - names that store. A
    # store called `gcpsm-backend` here would mean the tenant's manifest is not portable after
    # all, and portability was the entire reason for choosing this option.
    #
    # The name is an interface. Renaming it to match the implementation would be the mistake.
    gcpsm:
      projectID: platform-eng-lab-261031

      auth:
        workloadIdentity:
          # The zone, not the region. ADR-0003 forbids regional clusters - GKE's free tier covers
          # the management fee for one ZONAL cluster per billing account per month - so this is
          # asia-south1-a and a value of asia-south1 here would be a store that cannot find its
          # own cluster.
          clusterLocation: asia-south1-a
          clusterName: platform
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

      # NOTE WHAT IS ABSENT, because the absence is the point and an empty line would hide it:
      #
      #   no server address        Secret Manager is a Google API, not something we run
      #   no mount path            there is no mount
      #   no KV version            there is no KV engine
      #   no role                  the IAM binding is the role
      #   no token reviewer        GCP verifies the cluster's OIDC issuer itself
      #   no unseal key            and this is the one that matters
      #
      # The hardest problem in the on-prem design is an irreducible secret that a human holds and
      # re-enters after every cluster restart (.cache/vault-init.json, ADR-0018 Decision 3). It
      # does not exist here, because Google's KMS has a hardware root of trust and a laptop does
      # not. That is not Vault being badly designed - it is the same problem solved by somebody
      # with different hardware.
