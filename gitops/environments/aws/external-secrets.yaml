# External Secrets, aws. The operator is the SAME; only the backend changes.
#
# See the gcp overlay for the argument this file is half of. Inert until there is an Application
# in gitops/clusters/aws/ to read it, which is Module 10.
secretStore:
  enabled: true
  name: vault-backend
  provider:
    # Still `vault-backend`, for the reason spelled out in the gcp overlay: the store name is the
    # contract a tenant writes against, so it is deliberately not named after the implementation.
    aws:
      service: SecretsManager
      region: "" # set by Module 10, from terraform output

      # IRSA - the same idea as Workload Identity under a different name: the service account
      # below is annotated with a role ARN, and AWS trusts the cluster's OIDC provider. The
      # ExternalSecret above it does not change, and neither does the tenant's chart.
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
