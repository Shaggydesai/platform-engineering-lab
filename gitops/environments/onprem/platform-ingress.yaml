# Ingress, on-prem.
#
# The only environment where this is fully on. The numbers here MUST match the loadbalancer
# block in clusters/onprem/nodes.json - `make lint` checks it, because two files holding the
# same address is exactly how a lab ends up announcing an address nothing expects.
#
# Why these addresses are safe to claim: the libvirt platform network has no DHCP range at all
# (terraform/onprem/main.tf declares only the bridge address), so the only occupied addresses on
# 192.168.100.0/24 are .1 and the three nodes. ADR-0013.
loadBalancer:
  enabled: true
  poolStart: "192.168.100.200"
  poolStop: "192.168.100.239"

l2:
  enabled: true
  # Replaces the chart default rather than adding to it - Helm replaces lists, it does not merge
  # them (ADR-0010). Written out here so the override is visible at the point of use.
  interfaces:
    - "^en"

gateway:
  enabled: true

  # PINNED, which on this substrate costs nothing. ADR-0013 picked .200 out of a pool this
  # project owns, and the address is therefore a configuration choice: it is written here, the
  # workstation's hosts file points at it, and it does not move between rebuilds.
  #
  # Stated explicitly even though it is the chart's default, because the GCP overlay says
  # `provider` and the pair of files is where the difference is legible. That difference is
  # sharper than it looks - on GKE an address is an ALLOCATION, and pinning one means reserving
  # a static address that GCP bills while unattached (ADR-0021).
  addressFrom: pinned
  address: "192.168.100.200"

  hostname: "gw.platform.local"
  wildcardHostname: "*.platform.local"

routes:
  argocd:
    enabled: true
    hostname: "argocd.platform.local"

  shopverse:
    enabled: true
    hostname: "shopverse.platform.local"
    # Must match the Application's destination namespace in
    # gitops/clusters/onprem/apps/shopverse.yaml, which the tenants AppProject constrains to
    # shopverse-*.
    namespace: "shopverse-prod"

certificate:
  enabled: true
