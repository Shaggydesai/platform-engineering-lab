# metrics-server, on-prem only. ADR-0010 Decision 2.
#
# This file justifies the whole per-environment mechanism: the setting below is genuinely wrong
# everywhere else.
metrics-server:
  # Helm REPLACES lists across values files rather than merging them, so this `args` replaces
  # the chart's `args` entirely - which is why the chart leaves it empty and puts everything
  # else in `defaultArgs`. Were the chart's metric-resolution in `args`, this file would have
  # had to repeat it, and forgetting to would silently drop it.
  args:
    # Why this is needed on-prem and nowhere else:
    #
    # metrics-server scrapes each kubelet's /metrics/resource endpoint over TLS. kubeadm gives
    # each kubelet a SELF-SIGNED serving certificate by default, so that scrape fails
    # verification and every node reports as unavailable - with an x509 error that reads like a
    # cluster-wide certificate problem rather than one component's.
    #
    # The clean fix is serverTLSBootstrap in the KubeletConfiguration, which makes kubelets
    # request serving certs from the cluster CA. kubeadm does not auto-approve those CSRs, so it
    # needs a signing controller - a whole component, for one scrape path. Parked in
    # docs/parking-lot.md and revisited during this module's cert-manager work.
    #
    # On GKE and EKS the kubelet certificates are managed by the provider, where this flag is
    # both unnecessary and a downgrade. That is exactly why it lives here and not in the chart.
    - --kubelet-insecure-tls
