# Vault, on-prem. The chart's values already express every decision (ADR-0018), so this overlay
# exists to turn it on and to say nothing twice.
#
# Deliberately empty of settings: duplicating the chart's values here would create two places to
# change one thing, which is the mistake `make lint` had to be taught to catch for the load
# balancer addresses.
vault:
  server:
    enabled: true

# The exception to "says nothing twice": this is not a duplicate of anything, it is the one
# setting that depends on what else exists in THIS cluster. Vault's API is plaintext HTTP
# (tls_disable = 1 in the chart's default config), so restricting who can open a socket to it is
# the mitigation rather than a refinement.
networkPolicy:
  enabled: true
  port: 8200
  clients:
    - namespace: external-secrets
      # The ESO CONTROLLER only. Its webhook and cert-controller pods carry different
      # app.kubernetes.io/name values (external-secrets-webhook, external-secrets-cert-controller)
      # and neither talks to Vault, so neither is listed.
      #
      # If this name is wrong, ESO cannot reach Vault and the symptom is a ClusterSecretStore that
      # never becomes Ready - not an obviously network-shaped failure. `make eso-check` compares
      # this selector against the controller pod's real labels before it probes anything, because
      # a label typo and a broken Vault role look identical from the outside.
      name: external-secrets
      reason: External Secrets Operator reads secrets from Vault on every namespace's behalf
