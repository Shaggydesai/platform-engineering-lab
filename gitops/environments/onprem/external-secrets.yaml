# External Secrets, on-prem. The backend is the Vault running in this cluster.
#
# Everything about the operator itself is in the chart's values; this file exists to say one
# thing - where secrets come from - because that is the one thing that differs per substrate.
secretStore:
  enabled: true
  name: vault-backend
  provider:
    vault:
      # Plain HTTP, and this is the uncomfortable part of ADR-0018 Decision 2.
      #
      # The HashiCorp chart's default standalone config contains `tls_disable = 1`, and the chart
      # values deliberately do not rewrite that stanza (rewriting it is how the `storage "file"`
      # block gets lost). So the token ESO sends and the secrets Vault returns cross the pod
      # network in cleartext.
      #
      # What makes that tolerable rather than careless:
      #
      #   - the NetworkPolicy in gitops/charts/vault restricts port 8200 to the ESO controller
      #     pod alone, so there is one permitted peer rather than every pod in the cluster
      #   - Cilium encrypts nothing here, so "in cleartext on the pod network" means readable by
      #     anyone with root on a node - who can also read Vault's unsealed memory
      #
      # The real fix is cert-manager issuing Vault a serving certificate from the platform CA
      # (ADR-0012), which is a Module 08 change and is in the parking lot. It is NOT fixed by
      # hoping nobody looks.
      server: http://vault.vault.svc.cluster.local:8200

      # KV version 2 mounted at `secret/`. Both halves matter:
      #
      # `path` is the MOUNT, not the secret's path - ESO appends the ExternalSecret's `key` to
      # it. And v2 is not the default in a non-dev Vault: dev mode mounts KV v2 at `secret/`
      # automatically, a real one mounts nothing, which is why `make vault-bootstrap` exists.
      #
      # v2 also changes the API path (`secret/data/x`, not `secret/x`), which is what Vault's
      # policy has to be written against. Getting that wrong produces a permission denial on a
      # path that looks correct.
      path: secret
      version: v2

      auth:
        kubernetes:
          # Where the auth method is mounted inside Vault. `make vault-bootstrap` reads this
          # object out of the cluster and configures Vault to match, so this file is the source
          # of truth and Vault is the thing reconciled to it - the same direction as everything
          # else here.
          mountPath: kubernetes
          role: external-secrets

          # ESO mints a short-lived token for THIS service account via the TokenRequest API and
          # presents it to Vault, which verifies it with a TokenReview call back to the API
          # server. Three identities are involved and it is worth keeping them straight:
          #
          #   this SA        - who ESO claims to be
          #   Vault's own SA - who asks the API server "is that token real?" (needs
          #                    system:auth-delegator; vault-bootstrap checks rather than assumes)
          #   the Vault role - what that identity is then allowed to read
          #
          # Note the consequence of a CLUSTER store: this is one identity for every namespace.
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
