# External Secrets Operator on GKE: the portable half of ADR-0018, on the second substrate.
#
# Unlike Vault, this Application is deployed on EVERY substrate. Vault exists only on-prem,
# because GKE and EKS have a managed secret backend with a hardware root of trust; ESO exists
# everywhere, because it is the thing that reads whichever backend is present and writes an
# ordinary Kubernetes Secret.
#
# That asymmetry is the design, not an accident of what has been built so far - and this file is
# where it stops being a claim. Compare it to gitops/clusters/onprem/platform/external-secrets.yaml:
# the difference is ONE path segment, `environments/onprem` to `environments/gcp`, and the wave.
#
# NO SYNC WAVE, and the absence is deliberate rather than an omission.
#
# The on-prem Application carries wave -3, which it got for readability: Vault is -4 and
# local-path is -5, so the waves read in dependency order even though the on-prem comment says
# plainly that the ordering is not load-bearing (ESO starting before Vault simply reports the
# store NotReady and retries). On GKE there is no Vault and no local-path, so there is nothing to
# be after. ADR-0010 Decision 4 requires a wave to have a dependency that FAILS without it;
# copying -3 across would have made the number mean "this came from the other file".
#
# WHAT THIS NEEDS THAT THE CLUSTER CANNOT PROVIDE: the Google service account, the IAM binding on
# the secret, the Workload Identity binding, and a secret with a version in it. All four live in
# terraform/gcp/secrets, which deliberately SURVIVES `make gcp-down` - regenerating credentials
# every session would hand a fresh mongo-password to a database initialised with the previous one.
#
#   make gcp-secrets          the identity and the empty secret
#   make gcp-secrets-seed     the six values, generated and streamed in on stdin
#   make gcp-secrets-verify   read the whole arrangement back out of the API
#
# Without them the ClusterSecretStore reports Ready=False, which is a loud failure and a correct
# one - so the ordering between this Application and that Terraform is not enforced anywhere, on
# purpose. A store that cannot reach its backend retries; it does not break the cluster.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  sources:
    - repoURL: https://github.com/Shaggydesai/platform-engineering-lab.git
      targetRevision: main
      path: gitops/charts/external-secrets
      helm:
        valueFiles:
          - values.yaml
          - $values/gitops/environments/gcp/external-secrets.yaml

    - repoURL: https://github.com/Shaggydesai/platform-engineering-lab.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    # MUST BE external-secrets, and this is the one value in the file that is load-bearing beyond
    # itself. The Workload Identity binding in terraform/gcp/secrets names the principal
    # `...svc.id.goog[external-secrets/external-secrets]` - namespace and service account. A
    # different namespace here means a pod whose token Google will not exchange, and the failure
    # is a 403 from the metadata server that reads like a missing IAM role.
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply, for the same reason as cert-manager: ESO's CRDs are large, and a
      # client-side apply stores the entire manifest in the
      # kubectl.kubernetes.io/last-applied-configuration annotation, which has a hard
      # 262144-byte limit. The failure is "metadata.annotations: Too long", which names the
      # annotation and not the cause - so it reads like a Kubernetes bug rather than an
      # apply-strategy choice.
      #
      # Third chart in this repository to need it. Assume any chart shipping CRDs does.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  # No ignoreDifferences, same as on-prem. ESO's cert controller writes the webhook's CA bundle
  # into the ValidatingWebhookConfiguration at runtime, which is a field Git does not set - but
  # the chart leaves `caBundle` absent rather than empty, so there is nothing for Argo CD to diff
  # against. If a permanent OutOfSync ever appears on that object, this comment is the first place
  # to look, and the fix is a narrow ignoreDifferences with the reason attached.
