# External Secrets Operator: the portable half of ADR-0018.
#
# Unlike Vault, this Application is deployed on EVERY substrate. Vault exists only on-prem,
# because GKE and EKS have a managed secret backend with a hardware root of trust; ESO exists
# everywhere, because it is the thing that reads whichever backend is present and writes an
# ordinary Kubernetes Secret.
#
# That asymmetry is the design, not an accident of what has been built so far.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave -3: after Vault (-4), which is after local-path (-5).
    #
    # Not load-bearing, and said so deliberately: ESO starting before Vault is harmless, because
    # the ClusterSecretStore simply reports NotReady and retries. The ordering is here so the
    # waves READ in dependency order, which is worth something when there are nine Applications.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform

  sources:
    - repoURL: https://github.com/Shaggydesai/platform-engineering-lab.git
      targetRevision: main
      path: gitops/charts/external-secrets
      helm:
        valueFiles:
          - values.yaml
          - $values/gitops/environments/onprem/external-secrets.yaml

    - repoURL: https://github.com/Shaggydesai/platform-engineering-lab.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply, for the same reason as cert-manager: ESO's CRDs are large, and a
      # client-side apply stores the entire manifest in the
      # kubectl.kubernetes.io/last-applied-configuration annotation, which has a hard 262144-byte
      # limit. The failure is "metadata.annotations: Too long", which names the annotation and not
      # the cause - so it reads like a Kubernetes bug rather than an apply-strategy choice.
      #
      # This is the second chart in this repository to need it. Two is a pattern: assume any
      # chart shipping CRDs needs server-side apply, rather than finding out from the error.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  # No ignoreDifferences. The webhook's CA bundle is the obvious candidate - ESO's cert controller
  # writes it into the ValidatingWebhookConfiguration at runtime, which is a field Git does not
  # set - but the chart leaves `caBundle` absent rather than empty, so there is nothing for Argo
  # CD to diff against. If a permanent OutOfSync ever appears on that object, this comment is the
  # first place to look, and the fix is a narrow ignoreDifferences with the reason attached -
  # never `recurse: false`-style guesswork (ADR-0012's addendum).
