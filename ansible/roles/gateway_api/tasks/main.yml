---
# gateway_api: install the Gateway API CRDs.
#
# Layer 1, owned by Ansible, because they are a PREREQUISITE of the CNI: Cilium's
# gatewayAPI.enabled does nothing at all until these resource types exist (ADR-0012 Decision 2).
# So they must land before the Cilium role runs, which is why this play comes first.
#
# This is the only thing in the repository that arrives as a raw URL rather than a Helm chart,
# so it is pinned by CONTENT as well as by version. A tag is a mutable pointer; a digest is not.

- name: Make sure the download directory exists
  # THE THIRD TIME. `template` did not create /etc/kubernetes/kubeadm, `fetch` did not create
  # ~/.kube, and now `get_url` does not create .cache. None of Ansible's file modules create
  # parent directories, and each of the three failed only on a machine where the directory had
  # not already been made by hand for some other reason.
  #
  # The pattern worth remembering: any task with a `dest:` needs the directory asserted first,
  # and "it worked on my machine" means the directory was already there.
  ansible.builtin.file:
    path: "{{ gateway_api_bundle | dirname }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true
  become: false

- name: Is the bundle already on disk, and is it the right bundle?
  # ASKED BEFORE DOWNLOADING, so a correct local copy is not fetched again. This is 1.1 MB from
  # GitHub on every run of the playbook, and on 2026-11-05 that download TIMED OUT - having
  # already written all 1171163 bytes correctly. The task reported "Connection failure: The read
  # operation timed out" about a file that was complete and whose digest matched the pin.
  #
  # That is this repository's recurring shape in a new place: the task's verdict described the
  # transport rather than the outcome. The outcome is "do I hold the bytes the pin names", which
  # is a question about the disk, and it is now asked first.
  ansible.builtin.stat:
    path: "{{ gateway_api_bundle }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  run_once: true
  become: false
  register: gw_existing

- name: Fetch the Gateway API CRD bundle
  # To the workstation, not to a node. Nothing is applied from here yet - the download and the
  # verification are separate from the apply on purpose, so that a failed checksum means
  # "nothing happened" rather than "half of it happened".
  #
  # SKIPPED WHEN THE LOCAL COPY ALREADY MATCHES THE PIN. The three conditions are not redundant:
  # the file may be absent, or the digest may be unrecorded (the first-run bootstrap flow the
  # assert below prints), or the file may be the wrong bytes. Only the last of those is a
  # mismatch; the middle one looks like a mismatch and is not, which is why it is named rather
  # than left to a comparison against an empty string.
  #
  # TIMEOUT AND RETRIES, because the default is 10 seconds and this file does not always arrive
  # in 10 seconds from India. `force: true` with the skip above means a retry re-downloads from
  # the start rather than resuming a partial file - correct for 1.1 MB, and it is why a truncated
  # download cannot survive into the next run.
  ansible.builtin.get_url:
    url: >-
      https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version
      }}/standard-install.yaml
    dest: "{{ gateway_api_bundle }}"
    mode: "0644"
    force: true
    timeout: 60
  delegate_to: localhost
  run_once: true
  become: false
  when: >-
    not gw_existing.stat.exists
    or gateway_api_sha256 | length == 0
    or gw_existing.stat.checksum | default('') != gateway_api_sha256
  register: gw_download
  until: gw_download is succeeded
  retries: 3
  delay: 5
  changed_when: false
  # changed_when: false because downloading a file to a temporary path is not a change to
  # anything that matters. The apply below is where change is reported.

- name: Compute the bundle's digest
  # A separate `stat` rather than get_url's own checksum field, because get_url reports
  # checksum_src in SHA-1 by default. A failed run therefore prints a 40-character hex string
  # that looks exactly like something to record and is the wrong algorithm entirely; this task
  # is the only place a SHA-256 of this file is produced. 64 characters, not 40.
  ansible.builtin.stat:
    path: "{{ gateway_api_bundle }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  run_once: true
  become: false
  register: gw_stat

- name: Refuse to continue without a recorded digest
  # Deliberately a hard failure rather than a warning, and deliberately NOT "verify only if a
  # digest is set" - that default would leave the file unverified forever while looking
  # verified. The message is the fix, so discovering this costs one copy-paste.
  ansible.builtin.assert:
    that: gateway_api_sha256 | length > 0
    fail_msg: |
      Gateway API {{ gateway_api_version }} has no recorded digest. This is the first run.

      The bundle just downloaded has this SHA-256:

          {{ gw_stat.stat.checksum }}

      Record it in clusters/onprem/nodes.json:

          "gateway_api_sha256": "{{ gw_stat.stat.checksum }}"

      Then re-run. Paste it rather than retyping it, and commit it in the same change as the
      version - the two together are the pin, and a version without a digest is a pointer that
      upstream can move.
    success_msg: "digest recorded: {{ gateway_api_sha256[:16] }}..."
  run_once: true

- name: The bundle must match the recorded digest
  ansible.builtin.assert:
    that: gw_stat.stat.checksum == gateway_api_sha256
    fail_msg: |
      Gateway API {{ gateway_api_version }} does not match its recorded digest.

          expected  {{ gateway_api_sha256 }}
          got       {{ gw_stat.stat.checksum }}

      Nothing has been applied. One of three things happened, and they are worth distinguishing:

        - upstream re-tagged the release, which is exactly what a digest exists to catch;
        - the version in nodes.json was changed without updating the digest;
        - the download was corrupted or intercepted.

      Do not "fix" this by pasting the new digest in. Check the release notes for the version
      you pinned first.
    success_msg: "digest verified"
  run_once: true

- name: Would applying the CRDs change anything?
  # `kubectl apply --server-side` prints "serverside-applied" for every object whether or not
  # it changed - there is no "unchanged" in its output at all. So the previous
  # `changed_when: "'unchanged' not in stdout"` was true on every run, forever, and
  # `changed=0` was unreachable.
  #
  # Exit codes instead: 0 identical, 1 differs. The same gate the argocd role uses for the
  # same reason, and the only honest answer to "is this task about to do anything?"
  ansible.builtin.command: >-
    kubectl diff --server-side -f {{ gateway_api_bundle }}
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: gw_diff
  changed_when: false
  # Anything above 1 is a real error. Without this, a broken kubeconfig reads as
  # "no differences" and the apply is skipped silently.
  failed_when: gw_diff.rc not in [0, 1]

- name: Apply the Gateway API CRDs
  # --server-side for the same reason cert-manager's Application uses it: CRDs this size blow
  # past the 262144-byte limit on the last-applied-configuration annotation, and the resulting
  # error names the annotation rather than the cause.
  when: gw_diff.rc == 1
  ansible.builtin.command: >-
    kubectl apply --server-side --force-conflicts -f {{ gateway_api_bundle }}
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: gw_apply
  changed_when: true

- name: Wait for the CRDs to be established
  # "Applied" is not "usable". A CRD has to be Established before the API server will accept an
  # object of that type, and Cilium's operator checks for the types at startup - so starting
  # Cilium in the window between the two leaves Gateway support silently off.
  ansible.builtin.command: >-
    kubectl wait --for=condition=Established --timeout=120s
    crd/gatewayclasses.gateway.networking.k8s.io
    crd/gateways.gateway.networking.k8s.io
    crd/httproutes.gateway.networking.k8s.io
    crd/referencegrants.gateway.networking.k8s.io
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  changed_when: false

- name: Report
  ansible.builtin.debug:
    msg: >-
      Gateway API {{ gateway_api_version }} CRDs established
      (sha256 {{ gateway_api_sha256[:16] }}...)
  run_once: true
