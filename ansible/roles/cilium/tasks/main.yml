---
# cilium: the CNI, from the values file in Git. ADR-0007 for the choice; ADR-0002 puts the CNI in
# Layer 1 because Argo CD cannot run without a pod network, so a CNI owned by Argo CD would have
# to exist before the thing that installs it.
#
# helm runs on the WORKSTATION, not on a node: the nodes have no helm and no reason to acquire
# one, and the values file lives in this repository. So every task here is delegated to
# localhost and runs once.

- name: Is Cilium already installed, and at which version?
  # `helm upgrade --install` is idempotent in effect but always reports "changed", which would
  # make the second run of the playbook look like it did work. The Module 03 gate is
  # "changed=0 on the second run", so the question has to be asked before acting.
  ansible.builtin.command: >-
    helm list --namespace kube-system --filter '^cilium$' --output json
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: cilium_release
  changed_when: false

- name: What values is the release actually running with?
  # The version check alone is not enough, and this role shipped with that bug: changing
  # cilium-values.yaml without changing the version produced "already installed, nothing to
  # do" - so kubeProxyReplacement and gatewayAPI would have been set in Git and never applied.
  #
  # -o json rather than the default, which prefixes a "USER-SUPPLIED VALUES:" header that is
  # not parseable. Empty output means not installed, hence the default.
  ansible.builtin.command: >-
    helm get values cilium --namespace kube-system -o json
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: cilium_live_values
  changed_when: false
  failed_when: false

- name: Decide whether anything needs doing
  ansible.builtin.set_fact:
    cilium_installed: "{{ (cilium_release.stdout | from_json | length) > 0 }}"
    cilium_current: >-
      {{ (cilium_release.stdout | from_json | first).chart | default('none') | regex_replace('^cilium-', '') }}
    # Compare the release's stored values against the file, as parsed structures rather than as
    # text - so a comment or a reordered key does not read as a change.
    cilium_values_match: >-
      {{ (cilium_live_values.stdout | default('{}', true) | from_json)
         == (lookup('file', cilium_values_file) | from_yaml) }}
  run_once: true

- name: Install or upgrade Cilium
  when: >-
    not cilium_installed
    or cilium_current != cilium_version
    or not cilium_values_match
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - cilium
      - cilium/cilium
      - --version
      - "{{ cilium_version }}"
      - --namespace
      - kube-system
      - --values
      - "{{ cilium_values_file }}"
      - --wait
      - --timeout
      - 5m
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: cilium_install
  changed_when: true

- name: Report that it was already current
  when: cilium_installed and cilium_current == cilium_version and cilium_values_match
  ansible.builtin.debug:
    msg: "Cilium {{ cilium_current }} already installed with matching values, nothing to do"
  run_once: true

- name: Wait for the agent on every node
  # DaemonSet rollout, not pod count: a DaemonSet is "one per node", so this also waits for the
  # agent on a worker that joined moments ago.
  ansible.builtin.command: >-
    kubectl --namespace kube-system rollout status daemonset/cilium --timeout=180s
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  changed_when: false

- name: What configuration do the values ASK for?
  ansible.builtin.set_fact:
    cilium_desired_kpr: >-
      {{ ((lookup('file', cilium_values_file) | from_yaml).kubeProxyReplacement
          | default(false)) | string | lower }}
  run_once: true

- name: What configuration are the agents actually RUNNING?
  # The task that should have existed from the start, and the distinction that matters most in
  # this whole role.
  #
  # `helm upgrade` rewrote the cilium-config ConfigMap, waited, and reported success - and not
  # one agent restarted. The chart puts NO config checksum on the DaemonSet's pod template,
  # on purpose: a config change that nobody asked to be rolled should not restart the CNI on
  # every node at once. So the ConfigMap said kubeProxyReplacement: true while all three
  # agents went on running the configuration they loaded days earlier, with it false.
  #
  # kube_proxy_removal then read the ConfigMap, believed it, and deleted kube-proxy from a
  # cluster where nothing had taken over NodePort, externalIPs, HostPort, or host-namespace
  # ClusterIP. `make smoke` passed, because it only tests ClusterIP from inside a pod - which
  # Cilium serves through socket-LB even with replacement off.
  #
  # A ConfigMap is a REQUEST. `cilium-dbg status` is the answer. Every agent is asked, not one,
  # because a half-rolled DaemonSet is exactly the state worth catching.
  ansible.builtin.shell: |
    set -o pipefail
    for p in $(kubectl --namespace kube-system get pods -l k8s-app=cilium \
                 -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
      mode=$( (kubectl --namespace kube-system exec "$p" -- cilium-dbg status 2>/dev/null \
               || kubectl --namespace kube-system exec "$p" -- cilium status 2>/dev/null) \
             | awk '/^KubeProxyReplacement:/ {print tolower($2); exit}' )
      printf '%s=%s\n' "$p" "${mode:-unknown}"
    done
  args:
    executable: /bin/bash
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: cilium_running
  changed_when: false

- name: When was cilium-config last written, and when did the agents start?
  # The GENERAL form of the staleness question, instead of the one field I happened to think of.
  #
  # The field-by-field check below caught kubeProxyReplacement and missed l2announcements
  # completely: the helm upgrade added enable-l2-announcements to the ConfigMap, the agents kept
  # running without it, and the only symptom was a LoadBalancer address that was allocated and
  # answered by nobody. Enumerating fields does not scale and I will keep forgetting one.
  #
  # An agent that started BEFORE the ConfigMap was last written is stale, whatever changed in
  # it. managedFields carries a timestamp per manager and helm updates its own entry on every
  # upgrade, so the latest of those times is when the config last moved.
  #
  # Degrades to a skip rather than a failure when managedFields has no times - it is metadata
  # about a metadata mechanism, and a check that breaks the role when it cannot read itself is
  # worse than no check.
  ansible.builtin.shell: |
    set -o pipefail
    kubectl --namespace kube-system get configmap cilium-config -o json \
      | jq -r '[.metadata.managedFields[]?.time] | map(select(. != null)) | sort | last // ""'
    kubectl --namespace kube-system get pods -l k8s-app=cilium -o json \
      | jq -r '[.items[].status.startTime] | map(select(. != null)) | sort | first // ""'
  args:
    executable: /bin/bash
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: cilium_times
  changed_when: false

- name: Are the agents older than the configuration they are supposed to be running?
  ansible.builtin.set_fact:
    cilium_config_written: "{{ cilium_times.stdout_lines[0] | default('', true) }}"
    cilium_oldest_agent: "{{ cilium_times.stdout_lines[1] | default('', true) }}"
  run_once: true

- name: Decide whether a restart is needed
  ansible.builtin.set_fact:
    # Three independent reasons, because each one alone has a blind spot:
    #
    #   helm just changed something  - a ConfigMap-only change never rolls the DaemonSet, so
    #                                  "the upgrade succeeded" and "the agents run it" differ.
    #   the agents predate the config - catches a change from ANY earlier run, including one
    #                                  interrupted halfway, and catches fields nobody listed.
    #   the observed mode disagrees  - the recovery path. Neither of the above fires on a
    #                                  cluster that is already wrong with no upgrade pending,
    #                                  which is the state this role had to dig out of once.
    cilium_restart_needed: >-
      {{ (cilium_install is changed)
         or (cilium_config_written | length > 0 and cilium_oldest_agent | length > 0
             and (cilium_oldest_agent | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
                 < (cilium_config_written | to_datetime('%Y-%m-%dT%H:%M:%SZ')))
         or (cilium_running.stdout_lines
             | map('regex_replace', '^.*=', '')
             | reject('equalto', cilium_desired_kpr)
             | list | length > 0) }}
  run_once: true

- name: Why a restart is or is not happening
  ansible.builtin.debug:
    msg: >-
      restart={{ cilium_restart_needed }}
      (helm changed={{ cilium_install is changed }},
      config written={{ cilium_config_written | default('unknown', true) }},
      oldest agent={{ cilium_oldest_agent | default('unknown', true) }},
      modes={{ cilium_running.stdout_lines | map('regex_replace', '^.*=', '') | list | join(',') }})
  run_once: true

- name: Restart the agents and the operator when the running config disagrees with Git
  # Deliberately driven by the OBSERVED disagreement rather than by `cilium_install is changed`.
  # Gating on the helm task would not have recovered this cluster: the release already holds the
  # right values, so no upgrade is pending, so no restart would ever be triggered and the
  # agents would stay wrong forever. Reconciling against observed state fixes it on the next
  # run and does nothing on the run after that.
  #
  # Safe to restart with kube-proxy already gone only because of k8sServiceHost/k8sServicePort:
  # a starting agent reaches the API server by name through the node's /etc/hosts, not through
  # the 10.96.0.1 ClusterIP that nothing would be programming during the restart.
  when: cilium_restart_needed | bool
  ansible.builtin.command: >-
    kubectl --namespace kube-system rollout restart {{ item }}
  loop:
    - daemonset/cilium
    - deployment/cilium-operator
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: cilium_restart
  changed_when: true

- name: Wait for the restarted agents and operator
  when: cilium_restart is changed
  ansible.builtin.command: >-
    kubectl --namespace kube-system rollout status {{ item }} --timeout=300s
  loop:
    - daemonset/cilium
    - deployment/cilium-operator
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  changed_when: false

- name: Re-read the running configuration after the restart
  when: cilium_restart is changed
  ansible.builtin.shell: |
    set -o pipefail
    for p in $(kubectl --namespace kube-system get pods -l k8s-app=cilium \
                 -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
      mode=$( (kubectl --namespace kube-system exec "$p" -- cilium-dbg status 2>/dev/null \
               || kubectl --namespace kube-system exec "$p" -- cilium status 2>/dev/null) \
             | awk '/^KubeProxyReplacement:/ {print tolower($2); exit}' )
      printf '%s=%s\n' "$p" "${mode:-unknown}"
    done
  args:
    executable: /bin/bash
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: cilium_running_after
  changed_when: false

- name: Which reading is the current one?
  # After a restart the second reading is the truth; without one the first still is. A named
  # fact rather than a conditional expression repeated in three places - and `cond ? a : b`
  # is not Jinja, which is how the first version of this failed.
  ansible.builtin.set_fact:
    cilium_running_now: >-
      {{ (cilium_running_after if (cilium_restart is changed) else cilium_running) }}
  run_once: true

- name: Every agent must be running the configuration Git asks for
  # The gate. Without it this role can report success while the datapath is something else
  # entirely, which is precisely what it did.
  ansible.builtin.assert:
    that: >-
      cilium_running_now.stdout_lines
      | map('regex_replace', '^.*=', '')
      | reject('equalto', cilium_desired_kpr)
      | list | length == 0
    fail_msg: |
      At least one agent is not running kubeProxyReplacement={{ cilium_desired_kpr }}:

      {{ cilium_running_now.stdout }}

      "unknown" means cilium-dbg status could not be read from that pod at all - check the
      pod is Running before reading anything into the mode.

      Do NOT remove kube-proxy in this state. If kube-proxy is already gone, NodePort,
      externalIPs, HostPort and host-namespace ClusterIP are all unserved right now, while
      pod-sourced ClusterIP keeps working through socket-LB - so the cluster looks healthy
      and is not.
    success_msg: >-
      all {{ cilium_running.stdout_lines | length }} agents running
      kubeProxyReplacement={{ cilium_desired_kpr }}
  run_once: true

- name: Every node must now be Ready
  # Before the CNI, the kubelet refuses to call itself Ready because it cannot give a pod an
  # address. This is the task that closes that gap, so it is the right place to assert it.
  ansible.builtin.command: >-
    kubectl wait --for=condition=Ready nodes --all --timeout=120s
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  changed_when: false

- name: Gateway API support must actually be live
  # gatewayAPI.enabled lands in the same ConfigMap and had the same fate: the operator kept
  # running without Gateway support, so the GatewayClass the chart created sat at
  # ACCEPTED=Unknown with nothing to reconcile it.
  #
  # Waiting on the condition rather than on the object's existence is the point. The chart
  # creates the GatewayClass whether or not the controller is listening; only the controller
  # can set Accepted, so this is the one check that distinguishes "installed" from "working".
  when: >-
    (lookup('file', cilium_values_file) | from_yaml).gatewayAPI.enabled | default(false)
  ansible.builtin.command: >-
    kubectl wait --for=condition=Accepted --timeout=180s gatewayclass/cilium
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  changed_when: false
