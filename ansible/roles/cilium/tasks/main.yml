---
# cilium: the CNI, from the values file in Git. ADR-0007 for the choice; ADR-0002 puts the CNI in
# Layer 1 because Argo CD cannot run without a pod network, so a CNI owned by Argo CD would have
# to exist before the thing that installs it.
#
# helm runs on the WORKSTATION, not on a node: the nodes have no helm and no reason to acquire
# one, and the values file lives in this repository. So every task here is delegated to
# localhost and runs once.

- name: Is Cilium already installed, and at which version?
  # `helm upgrade --install` is idempotent in effect but always reports "changed", which would
  # make the second run of the playbook look like it did work. The Module 03 gate is
  # "changed=0 on the second run", so the question has to be asked before acting.
  ansible.builtin.command: >-
    helm list --namespace kube-system --filter '^cilium$' --output json
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: cilium_release
  changed_when: false

- name: What values is the release actually running with?
  # The version check alone is not enough, and this role shipped with that bug: changing
  # cilium-values.yaml without changing the version produced "already installed, nothing to
  # do" - so kubeProxyReplacement and gatewayAPI would have been set in Git and never applied.
  #
  # -o json rather than the default, which prefixes a "USER-SUPPLIED VALUES:" header that is
  # not parseable. Empty output means not installed, hence the default.
  ansible.builtin.command: >-
    helm get values cilium --namespace kube-system -o json
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: cilium_live_values
  changed_when: false
  failed_when: false

- name: Decide whether anything needs doing
  ansible.builtin.set_fact:
    cilium_installed: "{{ (cilium_release.stdout | from_json | length) > 0 }}"
    cilium_current: >-
      {{ (cilium_release.stdout | from_json | first).chart | default('none') | regex_replace('^cilium-', '') }}
    # Compare the release's stored values against the file, as parsed structures rather than as
    # text - so a comment or a reordered key does not read as a change.
    cilium_values_match: >-
      {{ (cilium_live_values.stdout | default('{}', true) | from_json)
         == (lookup('file', cilium_values_file) | from_yaml) }}
  run_once: true

- name: Install or upgrade Cilium
  when: >-
    not cilium_installed
    or cilium_current != cilium_version
    or not cilium_values_match
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - cilium
      - cilium/cilium
      - --version
      - "{{ cilium_version }}"
      - --namespace
      - kube-system
      - --values
      - "{{ cilium_values_file }}"
      - --wait
      - --timeout
      - 5m
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: cilium_install
  changed_when: true

- name: Report that it was already current
  when: cilium_installed and cilium_current == cilium_version and cilium_values_match
  ansible.builtin.debug:
    msg: "Cilium {{ cilium_current }} already installed with matching values, nothing to do"
  run_once: true

- name: Wait for the agent on every node
  # DaemonSet rollout, not pod count: a DaemonSet is "one per node", so this also waits for the
  # agent on a worker that joined moments ago.
  ansible.builtin.command: >-
    kubectl --namespace kube-system rollout status daemonset/cilium --timeout=180s
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  changed_when: false

- name: Every node must now be Ready
  # Before the CNI, the kubelet refuses to call itself Ready because it cannot give a pod an
  # address. This is the task that closes that gap, so it is the right place to assert it.
  ansible.builtin.command: >-
    kubectl wait --for=condition=Ready nodes --all --timeout=120s
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  changed_when: false
