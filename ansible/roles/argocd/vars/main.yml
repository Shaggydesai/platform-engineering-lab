---
# Values DERIVED from what the inventory supplies. Nothing substrate-specific belongs here -
# that lives in ansible/inventory/{nodes,gcp}.py, and ADR-0020 says why.
#
# vars/ rather than defaults/ deliberately. A default is a value a caller may reasonably
# override; this is an arithmetic consequence of argocd_chart_version and repo_root, and an
# inventory that overrode it would point the install at a file the fetch step did not create.

# Where `helm pull` puts the chart and where `helm upgrade` reads it from. The filename is helm's
# own convention (<name>-<version>.tgz) and is not ours to choose, which is the useful part: a
# tarball downloaded by hand, or by a colleague, or by the other substrate's run ten minutes ago,
# lands at exactly this path and is picked up with no configuration.
#
# The version is IN the filename, so moving the pin in clusters/platform.json does not silently
# reuse the old chart - the stat misses, the fetch runs, and the old file stays behind harmlessly
# in a gitignored directory.
argocd_chart_tgz: "{{ repo_root }}/.cache/argo-cd-{{ argocd_chart_version }}.tgz"

# Is this seam file's `kubectl diff` a CREATION or a real DIFFERENCE?
#
# `kubectl diff` exits 1 for both, and conflating them made the first install on a new cluster
# write a .cache/seam-diff-*.diff for every seam file - with hunk headers like `@@ -0,0 +1,24 @@`,
# meaning the live side was empty and nothing differed because nothing was there.
#
# Those files exist for ONE purpose: evidence for the unexplained seam re-applies in
# docs/parking-lot.md, where a saved diff is what finally showed the cause was a line of ours.
# An evidence directory that also fills up on every clean install is an evidence directory
# somebody has to sort before they can use it, which is most of the way to not using it.
#
# So: a diff whose every hunk starts at `-0,0` added lines to an empty file. That is a creation.
# Anything else is a difference and gets recorded.
#
# References `item`, so it is only meaningful inside the seam loop - Ansible resolves it lazily at
# use, which is what lets one definition serve both the save and the report task. Defining it
# twice is how those two come to disagree about what they are reporting.
argocd_seam_is_creation: >-
  {{ (item.stdout_lines | default([]) | select('match', '^@@ ') | list | length > 0)
     and (item.stdout_lines | select('match', '^@@ ')
           | reject('match', '^@@ -0,0 ') | list | length == 0) }}
