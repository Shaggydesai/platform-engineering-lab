---
# argocd: install Argo CD, then hand it the objects that are the seam (ADR-0009).
#
# Layer 2 of ADR-0002. The whole point of this role is that it can be re-run when Argo CD is the
# broken thing - so it must not depend on Argo CD working. Everything here is helm and kubectl
# from the workstation, with nothing fetched through Argo CD itself.
#
# SUBSTRATE-NEUTRAL (ADR-0020). This file names no cluster, no kubeconfig, no Application and no
# seam file. All of that arrives as inventory variables, so that "how Argo CD is installed" has
# ONE definition across on-prem, GCP and AWS - which is ADR-0001's premise applied to Layer 2
# itself rather than only to Layer 3.
#
# It was always nearly true: every task here already delegates to localhost and runs helm and
# kubectl rather than anything over SSH, because the role had to work when the cluster's own
# control plane was the thing being repaired. That property is what made a managed cluster with
# no control-plane host to log into a one-day change rather than a rewrite.

# ---------------------------------------------------------------------------- what this needs
- name: Every substrate-specific value this role reads must be defined
  # Ansible already fails on an undefined variable, but it fails at the task that happens to
  # touch it first - which here would be `helm list`, reporting an unrelated-looking error about
  # a template. Naming them together, at the top, means a new substrate's inventory is told what
  # it forgot before anything runs.
  ansible.builtin.assert:
    that:
      - argocd_kubeconfig is defined and argocd_kubeconfig | length > 0
      - argocd_kube_context is defined and argocd_kube_context | length > 0
      - argocd_chart_version is defined
      - argocd_app_version is defined
      - argocd_values_file is defined
      - argocd_seam_files is defined and argocd_seam_files | length > 0
      - argocd_root_app is defined and argocd_root_app | length > 0
      - repo_root is defined
    fail_msg: >-
      This role is substrate-neutral and reads everything about WHICH cluster from the inventory.
      See ansible/inventory/nodes.py or gcp.py for the full set; ADR-0020 explains why they are
      variables rather than values in this file.
    success_msg: "targeting context {{ argocd_kube_context | default('?') }}"
  run_once: true

- name: Is there a helm and a kubectl to do any of this with?
  # BEFORE THE CONTEXT CHECK, and that ordering is the whole value of the task.
  #
  # This role is deliberately nothing but helm and kubectl run from the workstation (ADR-0009):
  # it has to keep working when the cluster's control plane is the broken thing, so it depends on
  # as little as possible. A missing binary is therefore the first thing that can go wrong.
  #
  # It is checked here rather than left to fail naturally because of what the natural failure
  # SAID. On a machine with neither binary installed, the context check below asked kubectl for
  # the list, got nothing because there was no kubectl, and reported "that kubeconfig has no
  # contexts" - against a file holding two. A check whose "no" does not mean no, for the fourth
  # time in this project, and this one was caught by deliberately pointing the role at a
  # hand-written kubeconfig to read the error message rather than by trusting it.
  #
  # `command -v` is a shell builtin, hence shell rather than command. The version flags differ
  # between the two tools (kubectl wants --client, helm wants nothing), and asking for a version
  # would conflate "not installed" with "installed and unhappy".
  ansible.builtin.shell: "command -v {{ item }}"
  args:
    executable: /bin/bash
  loop:
    - helm
    - kubectl
  delegate_to: localhost
  run_once: true
  become: false
  register: argocd_tools
  changed_when: false
  failed_when: false

- name: Both of them must be on PATH
  vars:
    missing: "{{ argocd_tools.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
  ansible.builtin.assert:
    that: missing | length == 0
    fail_msg: >-
      not on this workstation's PATH: {{ missing | join(', ') }}.
      Everything this role does is helm and kubectl from here, so there is nothing it can do
      without them - and the checks below would otherwise report their absence as a cluster
      problem. Install them with:  make tools
    success_msg: "helm and kubectl are both here"
  run_once: true

- name: Which contexts does that kubeconfig actually contain?
  # THE TASK THAT MAKES A SECOND SUBSTRATE SAFE, and it is worth saying what it is guarding.
  #
  # Until ADR-0020 this role passed no --context at all: it exported KUBECONFIG and let kubectl
  # use whatever current-context that file happened to carry. On-prem that was harmless, because
  # the fetched admin.conf holds exactly one cluster and nothing writes to it.
  #
  # It stops being harmless the moment a second substrate exists. `make gcp-kubeconfig` writes
  # into ~/.kube/config, which also holds onprem-admin and any stale gke_* context - and
  # current-context there is whatever the last gcloud or kubectl command set it to. A role that
  # installs Argo CD into "whichever cluster was most recently selected" is one `kubectl config
  # use-context` away from installing the on-prem platform onto GKE, and both would succeed.
  #
  # So the context is explicit now - and because it is explicit it can be WRONG, which is the
  # second half of the guard. The first attempt passed `{{ kube_context }}`, the readable name
  # (onprem-admin) that the control_plane role renames to in a COPY merged into ~/.kube/config.
  # The fetched file still carries kubeadm's own kubernetes-admin@onprem, so that flag would
  # have broken a working on-prem path with an error about a context, several layers from the
  # cause. This asks the file what it holds and prints the list.
  ansible.builtin.command: >-
    kubectl config get-contexts -o name
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  register: argocd_contexts
  changed_when: false
  failed_when: false

- name: The context this role is about to act on must exist in that kubeconfig
  vars:
    found_contexts: "{{ argocd_contexts.stdout_lines | default([]) }}"
    # `| default([])` on stdout_lines replaces UNDEFINED, not EMPTY, and the empty case is the
    # likely one: a fresh machine with no kubeconfig at all, or one gcloud has not written to
    # yet. The first version of this message read "It contains: ." - a sentence that sends
    # someone looking for a list of contexts that does not exist.
    #
    # The same shape as `${var:+text}` testing for non-empty rather than for set, which cost an
    # hour earlier in this project. A default is not a fallback for every falsy value, and in
    # Jinja, Ansible and bash alike it is worth knowing which one each tests.
    # Three outcomes, not two, and keeping them apart is the point. kubectl ran and listed
    # contexts; kubectl ran and the file holds none; or kubectl did not run at all, which the
    # task above now rules out but which this message should still be able to say rather than
    # silently reporting it as the second case.
    contexts_report: >-
      {{ ('it contains ' ~ (found_contexts | join(', ')))
         if (found_contexts | length > 0)
         else ('that file holds no contexts at all'
               if argocd_contexts.rc | default(1) == 0
               else ('kubectl could not read it: '
                     ~ ((argocd_contexts.stderr | default('') | trim)
                        or (argocd_contexts.msg | default('') | trim)
                        or ('exit ' ~ (argocd_contexts.rc | default('?')))))) }}
  ansible.builtin.assert:
    that: argocd_kube_context in found_contexts
    fail_msg: >-
      {{ argocd_kubeconfig }} has no context named {{ argocd_kube_context }} - {{ contexts_report }}.
      For GCP, `make gcp-kubeconfig` creates and names the context. For on-prem, the context in
      the fetched admin.conf is kubeadm's own kubernetes-admin@<cluster>, NOT the readable
      onprem-admin that only exists in ~/.kube/config.
    success_msg: "{{ argocd_kube_context }} found in {{ argocd_kubeconfig }}"
  run_once: true

# ---------------------------------------------------------------------------- install
- name: Add the Argo CD chart repository
  ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
  delegate_to: localhost
  run_once: true
  become: false
  register: argocd_repo
  changed_when: "'has been added' in argocd_repo.stdout"

- name: Refresh the chart repository index
  ansible.builtin.command: helm repo update argo
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false

- name: Is Argo CD already installed, and at which chart version?
  # Same reasoning as the cilium role: `helm upgrade --install` is idempotent in effect but
  # always reports changed, which would make "changed=0 on the second run" unreachable.
  ansible.builtin.command: >-
    helm list --kube-context {{ argocd_kube_context }}
    --namespace argocd --filter '^argocd$' --output json
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  register: argocd_release
  changed_when: false

- name: What values is the release actually running with?
  # Same bug as the cilium role had: a version-only check means editing argocd-values.yaml
  # changes nothing, silently. Argo CD is the worst component for that - a values change that
  # does not apply leaves Git and the cluster disagreeing about the thing whose job is to stop
  # Git and the cluster disagreeing.
  ansible.builtin.command: >-
    helm get values argocd --kube-context {{ argocd_kube_context }}
    --namespace argocd -o json
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  register: argocd_live_values
  changed_when: false
  failed_when: false

- name: Decide whether anything needs doing
  ansible.builtin.set_fact:
    argocd_installed: "{{ (argocd_release.stdout | from_json | length) > 0 }}"
    argocd_current: >-
      {{ (argocd_release.stdout | from_json | first).chart | default('none') | regex_replace('^argo-cd-', '') }}
    argocd_values_match: >-
      {{ (argocd_live_values.stdout | default('{}', true) | from_json)
         == (lookup('file', argocd_values_file) | from_yaml) }}
  run_once: true

# ------------------------------------------------------------------- the chart, as a separate step
#
# FETCHING THE CHART IS NOT PART OF INSTALLING IT, and separating them is a fix rather than
# tidiness. Written as one step - `helm upgrade --install argocd argo/argo-cd --version X` - helm
# downloads the tarball from GitHub's release CDN and then talks to the cluster, inside a single
# command whose failure says only "the command exited with a non-zero return code".
#
# On 2026-11-01 that step failed on GKE after two minutes with:
#
#   Error: Get "https://release-assets.githubusercontent.com/...argo-cd-10.11.0.tgz":
#   context deadline exceeded (Client.Timeout exceeded while awaiting headers)
#
# A WSL2 network reaching GitHub's asset CDN slowly, presenting as a failed Argo CD install on a
# brand-new cluster - with ten tasks of cluster-shaped output above it and `rc: 1` at the bottom.
# The first thing anyone would suspect is the cluster, and the cluster was fine.
#
# Three things fall out of splitting it:
#
#   the network step can RETRY, and only the network step. Retrying the combined command would
#   re-run a helm release install, which is idempotent but not free and not obviously safe to
#   repeat while `--wait` may have already started creating objects.
#
#   the download happens ONCE per chart version per workstation. A second run, or the other
#   substrate's run ten minutes later, uses the file on disk.
#
#   a human can put the file there. If that CDN is unreachable rather than slow, downloading the
#   tarball by any other means into .cache/ makes this role work unchanged - which is an escape
#   hatch the combined form did not have.
#
# .cache/ rather than /tmp, for the same reason the Gateway API bundle lives there (ADR-0012): a
# WSL shutdown clears /tmp, and the run most likely to need this is the one right after a restart.
- name: Where the pinned chart lives, and is it already there?
  ansible.builtin.stat:
    path: "{{ argocd_chart_tgz }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: argocd_chart_file

- name: Make sure .cache exists, for the chart and for the seam evidence later
  # Nothing in Ansible creates a parent directory, and "it exists because another role made it"
  # is a coincidence rather than a dependency - the fourth occurrence of that bug in this
  # repository. It is created HERE, before the first thing that writes into it, rather than
  # twice in one role: the seam-diff section further down used to create it again, which was
  # harmless and also two places to keep right.
  ansible.builtin.file:
    path: "{{ repo_root }}/.cache"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false

- name: Fetch the Argo CD chart, retrying the network and nothing else
  when: not argocd_chart_file.stat.exists
  ansible.builtin.command:
    argv:
      - helm
      - pull
      - argo/argo-cd
      - --version
      - "{{ argocd_chart_version }}"
      - --destination
      - "{{ repo_root }}/.cache"
  delegate_to: localhost
  run_once: true
  become: false
  register: argocd_pull
  # Four attempts over about 45 seconds. `retries: 4` means four ATTEMPTS, not one plus four -
  # Ansible's retry log counts down "3 retries left" to "0 retries left" and stops, and the
  # registered result reports `attempts: 4`. Checked by running it, after the comment here first
  # said four and was then "corrected" to five on a reading of the log that was off by one.
  #
  # Which is why the message below prints `argocd_pull.attempts` instead of restating the number.
  # A count written in prose beside a count in code is a second copy of a fact, and this one was
  # wrong within a minute of being written.
  #
  # A CDN that is slow rather than down usually answers on a later try; one that is down fails
  # every time and says so - a different message from "the install failed", which is the whole
  # point of this block.
  until: argocd_pull.rc == 0
  retries: 4
  delay: 15
  changed_when: argocd_pull.rc == 0
  # NOT a failure, so that the next task gets to explain it. A failed task ends the play, and
  # the explanation - which is the only useful output here - would never print. `until` still
  # drives the retries: failed_when only decides how the FINAL result is reported.
  failed_when: false

- name: If that CDN could not be reached, say so as a network problem
  when: not argocd_chart_file.stat.exists
  ansible.builtin.assert:
    that: argocd_pull.rc == 0
    fail_msg: |-
      helm could not download argo-cd-{{ argocd_chart_version }}.tgz after
      {{ argocd_pull.attempts | default('several') }} attempts.

      THIS IS THE WORKSTATION'S NETWORK, NOT THE CLUSTER. Nothing has been installed, and
      there is nothing wrong with {{ argocd_kube_context }} - the ten tasks above all passed
      against it. helm said:

        {{ (argocd_pull.stderr | default('') | trim) | truncate(300) }}

      Get the file to this path by any means and re-run; this role will find it and skip the
      download entirely:

        {{ argocd_chart_tgz }}

      From anywhere with working access to GitHub release assets:
        helm pull argo/argo-cd --version {{ argocd_chart_version }} --destination {{ repo_root }}/.cache
    success_msg: "fetched argo-cd-{{ argocd_chart_version }}.tgz"
  run_once: true

- name: The tarball on disk must be the version that was asked for
  # A download that times out part-way leaves a FILE. The stat above would then find it, every
  # later run would skip the fetch, and helm would fail to install a truncated archive - a
  # permanent failure caused by a transient one, which is the worst kind to inherit.
  #
  # `helm show chart` parses the archive, so this catches both a corrupt file and the case where
  # the pin moved while a tarball from the previous pin was still cached.
  ansible.builtin.command:
    argv:
      - helm
      - show
      - chart
      - "{{ argocd_chart_tgz }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: argocd_chart_meta
  changed_when: false
  failed_when: false

- name: And if it is not, say which rather than letting helm fail on it
  vars:
    on_disk: >-
      {{ (argocd_chart_meta.stdout | from_yaml).version | default('unreadable')
         if argocd_chart_meta.rc == 0 else 'unreadable' }}
  ansible.builtin.assert:
    that: on_disk == argocd_chart_version
    fail_msg: >-
      {{ argocd_chart_tgz }} is {{ on_disk }}, not {{ argocd_chart_version }}.
      A download interrupted part-way leaves a file that every later run then trusts, so delete
      it and re-run:  rm {{ argocd_chart_tgz }}
    success_msg: "chart {{ on_disk }} on disk at {{ argocd_chart_tgz }}"
  run_once: true

- name: Install or upgrade Argo CD
  when: >-
    not argocd_installed
    or argocd_current != argocd_chart_version
    or not argocd_values_match
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - argocd
      # THE LOCAL TARBALL, not argo/argo-cd. By the time this runs the chart is on disk and
      # verified, so this command touches the network only to reach the cluster - which means a
      # failure here is about the cluster, and can be read that way.
      #
      # NOTE THE MISSING --version. helm rejects it against a local chart path, and the pin is
      # not lost: it selected the file (which the task above re-read out of the archive), and the
      # app-version assertion below reads back what actually landed in the cluster.
      - "{{ argocd_chart_tgz }}"
      # helm's flag is --kube-context, not --context. Spelled the kubectl way it is rejected as
      # an unknown flag, which is at least loud; the dangerous version is leaving it off, because
      # helm then silently uses the kubeconfig's current-context.
      - --kube-context
      - "{{ argocd_kube_context }}"
      - --namespace
      - argocd
      - --create-namespace
      - --values
      - "{{ argocd_values_file }}"
      - --wait
      - --timeout
      - 10m
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  register: argocd_install
  changed_when: true

- name: Report that it was already current
  when: argocd_installed and argocd_current == argocd_chart_version and argocd_values_match
  ansible.builtin.debug:
    msg: "Argo CD chart {{ argocd_current }} already installed with matching values, nothing to do"
  run_once: true

- name: Confirm the chart installed the Argo CD version we expect
  # The chart version and the Argo CD version are two different numbers, and only one of them
  # is pinned. A chart patch release can carry a different app version, so this asserts what
  # actually landed rather than trusting the pin to imply it.
  #
  # It matters because the argocd CLI on this workstation talks to this server, and a CLI far
  # ahead of its server fails in ways that read like permissions problems.
  ansible.builtin.command: >-
    helm list --kube-context {{ argocd_kube_context }}
    --namespace argocd --filter '^argocd$' --output json
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  register: argocd_installed_release
  changed_when: false

- name: The installed app version must match clusters/platform.json
  ansible.builtin.assert:
    that: >-
      (argocd_installed_release.stdout | from_json | first).app_version == argocd_app_version
    fail_msg: >-
      Chart {{ argocd_chart_version }} installed Argo CD
      {{ (argocd_installed_release.stdout | from_json | first).app_version }}, but
      clusters/platform.json says {{ argocd_app_version }}. That file is shared by every
      substrate, so this is one number for all three clusters.
      Check `helm search repo argo/argo-cd --versions`, which
      prints CHART VERSION and APP VERSION side by side, and update whichever is wrong.
    success_msg: "chart {{ argocd_chart_version }} -> Argo CD {{ argocd_app_version }}"
  run_once: true

- name: Wait for the application controller
  # The controller is what reconciles; without it the Applications below are inert objects.
  ansible.builtin.command: >-
    kubectl --context {{ argocd_kube_context }}
    --namespace argocd rollout status statefulset/argocd-application-controller --timeout=300s
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  changed_when: false

- name: Does the seam differ from what is in Git?
  # `kubectl diff` exits 0 when nothing would change and 1 when something would. That exit code
  # is a better answer to "is this task going to do anything?" than parsing the words kubectl
  # prints afterwards, which is what the first version of this role did.
  #
  # --server-side matters here: these objects are CO-MANAGED. Argo CD's controller writes
  # transient metadata of its own (a refresh annotation, the operation field) and a client-side
  # diff counts anything absent from our file as a difference to remove. That produced a
  # "changed" on an unchanged file, nondeterministically, depending on whether a refresh
  # happened to be in flight.
  ansible.builtin.command: >-
    kubectl --context {{ argocd_kube_context }}
    diff --server-side -f {{ repo_root }}/gitops/bootstrap/{{ item }}
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  # The list is per-substrate (ADR-0020) and the ORDER still matters: an Application referencing
  # a missing AppProject is rejected, so projects.yaml is first in every inventory that defines
  # this. On-prem has three files - the second tenant root arrived with ADR-0016; GCP has two,
  # because there is no tenant on it yet.
  #
  # projects.yaml itself is SHARED and unchanged, which was not planned. The AppProjects turned
  # out to be substrate-independent: their destinations name https://kubernetes.default.svc, the
  # address a cluster uses for itself, so the boundary travels without edit.
  loop: "{{ argocd_seam_files }}"
  register: argocd_seam_diff
  changed_when: false
  # 0 = identical, 1 = differs. Anything else is a real error, and without this a broken
  # kubeconfig would read as "no differences" and the apply would be skipped silently.
  failed_when: argocd_seam_diff.rc not in [0, 1]

- name: A timestamp for the evidence file
  # Not the gathered-facts date, and not for style: that fact only exists if facts were
  # gathered, and `make onprem-argocd` runs --tags argocd, which skips the preflight play that
  # gathers them. The task would work on a full run and fail on exactly the run someone reaches
  # for when Argo CD is the broken thing - the one job this role exists to do.
  #
  # The .cache directory this writes into is created near the top of this role, not by the
  # gateway_api role, which is skipped by the same tag.
  ansible.builtin.set_fact:
    seam_stamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
  run_once: true

- name: Record WHAT differs, whenever something does
  # Added after the second unexplained occurrence, both times on the first run after the cluster
  # was restarted. The parking-lot entry said to capture the diff next time it happened; relying
  # on a human to remember that, during the one run where it is visible, is not a plan - the
  # apply fires in the same playbook and the evidence is gone.
  #
  # So the role keeps it. The file is the thing to read when this recurs; the printed form is
  # for whoever is watching the run.
  #
  # NOT on a first creation. `kubectl diff` exits 1 whether the object differs or does not exist,
  # and the first install on GKE therefore saved an evidence file per seam file, each one a diff
  # against nothing (`@@ -0,0 +1,24 @@`). See argocd_seam_is_creation in this role's vars/.
  when: item.rc == 1 and not (argocd_seam_is_creation | bool)
  ansible.builtin.copy:
    dest: "{{ repo_root }}/.cache/seam-diff-{{ item.item }}-{{ seam_stamp }}.diff"
    mode: "0644"
    content: |
      # {{ item.item }} differed from the live object at {{ seam_stamp }}
      # Context: {{ argocd_kube_context }}. Evidence for docs/parking-lot.md, not config.
      # Written by the argocd role because the apply below erases the difference immediately.
      {{ item.stdout }}
  loop: "{{ argocd_seam_diff.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false

- name: Say which seam objects are simply not there yet
  # One line each, rather than the full diff. On a new cluster this is every seam file and the
  # diff is a creation against nothing - which is worth SAYING, because "the seam is being
  # created" and "the seam has drifted" are the same exit code and want very different reactions.
  when: item.rc == 1 and (argocd_seam_is_creation | bool)
  ansible.builtin.debug:
    msg: "{{ item.item }}: not in the cluster yet - this apply creates it, nothing has drifted"
  loop: "{{ argocd_seam_diff.results }}"
  loop_control:
    label: "{{ item.item }}"
  run_once: true

- name: Show the difference while it is still visible
  when: item.rc == 1 and not (argocd_seam_is_creation | bool)
  ansible.builtin.debug:
    msg: |
      {{ item.item }} differs from the live object. Saved to
      .cache/seam-diff-{{ item.item }}-{{ seam_stamp }}.diff

      {{ item.stdout | default('(kubectl diff printed nothing, which is itself the finding)', true) }}
  loop: "{{ argocd_seam_diff.results }}"
  loop_control:
    label: "{{ item.item }}"
  run_once: true

- name: Apply the seam - the AppProjects and the root Application
  # THE ONLY in-cluster objects Ansible applies besides the Helm release, and ADR-0009 says
  # nothing may be added here without amending it. Order matters: an Application referencing a
  # missing AppProject is rejected, so projects.yaml goes first - which is why this loops over
  # the diff results in order rather than over a directory.
  #
  # --server-side records which fields WE own and leaves the controller's alone, instead of
  # treating "not in my file" as "delete it". --force-conflicts takes ownership of the fields
  # the previous client-side applies claimed; without it, the first server-side apply of an
  # object that was applied client-side fails on every field.
  #
  # kubectl rather than a Kubernetes Ansible module on purpose: the module needs the python
  # kubernetes library on the workstation, and this role is the recovery path - it should depend
  # on as little as possible.
  ansible.builtin.command: >-
    kubectl --context {{ argocd_kube_context }}
    apply --server-side --force-conflicts
    -f {{ repo_root }}/gitops/bootstrap/{{ item.item }}
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  loop: "{{ argocd_seam_diff.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 1
  register: argocd_seam
  changed_when: true

- name: Wait for the root Application to report Synced and Healthy
  # The real test of this role. Argo CD running is not the same as Argo CD reconciling: a wrong
  # repoURL, a project that forbids the destination, or a path that does not exist all leave a
  # perfectly healthy Argo CD managing nothing.
  ansible.builtin.command: >-
    kubectl --context {{ argocd_kube_context }}
    --namespace argocd get application {{ argocd_root_app }}
    -o jsonpath='{.status.sync.status}/{.status.health.status}'
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  register: argocd_root_status
  until: argocd_root_status.stdout == 'Synced/Healthy'
  retries: 30
  delay: 10
  changed_when: false

- name: Report
  ansible.builtin.debug:
    msg: |
      Argo CD chart {{ argocd_chart_version }} -> {{ argocd_app_version }}
      context           {{ argocd_kube_context }}   ({{ argocd_kubeconfig }})
      root Application  {{ argocd_root_app }}: {{ argocd_root_status.stdout }}
      seam applied      {{ argocd_seam_files | join(', ') }}

      UI:        make argocd-ui CTX={{ argocd_kube_context }}
                 port-forward to http://localhost:8080 - http, not https, because
                 server.insecure is on (see the values file for when that becomes wrong)
      Password:  make argocd-password CTX={{ argocd_kube_context }}
                 from the Secret the chart generated - never in Git

      From here, nothing in this cluster is installed by hand. Adding a component means adding
      a file to {{ argocd_platform_path | default('the cluster platform directory') }} and
      pushing it.
  run_once: true
