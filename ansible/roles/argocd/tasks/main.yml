---
# argocd: install Argo CD, then hand it the three objects that are the seam (ADR-0009).
#
# Layer 2 of ADR-0002. The whole point of this role is that it can be re-run when Argo CD is the
# broken thing - so it must not depend on Argo CD working. Everything here is helm and kubectl
# from the workstation, with nothing fetched through Argo CD itself.

- name: Add the Argo CD chart repository
  ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
  delegate_to: localhost
  run_once: true
  become: false
  register: argocd_repo
  changed_when: "'has been added' in argocd_repo.stdout"

- name: Refresh the chart repository index
  ansible.builtin.command: helm repo update argo
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false

- name: Is Argo CD already installed, and at which chart version?
  # Same reasoning as the cilium role: `helm upgrade --install` is idempotent in effect but
  # always reports changed, which would make "changed=0 on the second run" unreachable.
  ansible.builtin.command: >-
    helm list --namespace argocd --filter '^argocd$' --output json
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: argocd_release
  changed_when: false

- name: What values is the release actually running with?
  # Same bug as the cilium role had: a version-only check means editing argocd-values.yaml
  # changes nothing, silently. Argo CD is the worst component for that - a values change that
  # does not apply leaves Git and the cluster disagreeing about the thing whose job is to stop
  # Git and the cluster disagreeing.
  ansible.builtin.command: >-
    helm get values argocd --namespace argocd -o json
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: argocd_live_values
  changed_when: false
  failed_when: false

- name: Decide whether anything needs doing
  ansible.builtin.set_fact:
    argocd_installed: "{{ (argocd_release.stdout | from_json | length) > 0 }}"
    argocd_current: >-
      {{ (argocd_release.stdout | from_json | first).chart | default('none') | regex_replace('^argo-cd-', '') }}
    argocd_values_match: >-
      {{ (argocd_live_values.stdout | default('{}', true) | from_json)
         == (lookup('file', argocd_values_file) | from_yaml) }}
  run_once: true

- name: Install or upgrade Argo CD
  when: >-
    not argocd_installed
    or argocd_current != argocd_chart_version
    or not argocd_values_match
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - argocd
      - argo/argo-cd
      - --version
      - "{{ argocd_chart_version }}"
      - --namespace
      - argocd
      - --create-namespace
      - --values
      - "{{ argocd_values_file }}"
      - --wait
      - --timeout
      - 10m
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: argocd_install
  changed_when: true

- name: Report that it was already current
  when: argocd_installed and argocd_current == argocd_chart_version and argocd_values_match
  ansible.builtin.debug:
    msg: "Argo CD chart {{ argocd_current }} already installed with matching values, nothing to do"
  run_once: true

- name: Confirm the chart installed the Argo CD version we expect
  # The chart version and the Argo CD version are two different numbers, and only one of them
  # is pinned. A chart patch release can carry a different app version, so this asserts what
  # actually landed rather than trusting the pin to imply it.
  #
  # It matters because the argocd CLI on this workstation talks to this server, and a CLI far
  # ahead of its server fails in ways that read like permissions problems.
  ansible.builtin.command: >-
    helm list --namespace argocd --filter '^argocd$' --output json
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: argocd_installed_release
  changed_when: false

- name: The installed app version must match nodes.json
  ansible.builtin.assert:
    that: >-
      (argocd_installed_release.stdout | from_json | first).app_version == argocd_app_version
    fail_msg: >-
      Chart {{ argocd_chart_version }} installed Argo CD
      {{ (argocd_installed_release.stdout | from_json | first).app_version }}, but nodes.json
      says {{ argocd_app_version }}. Check `helm search repo argo/argo-cd --versions`, which
      prints CHART VERSION and APP VERSION side by side, and update whichever is wrong.
    success_msg: "chart {{ argocd_chart_version }} -> Argo CD {{ argocd_app_version }}"
  run_once: true

- name: Wait for the application controller
  # The controller is what reconciles; without it the Applications below are inert objects.
  ansible.builtin.command: >-
    kubectl --namespace argocd rollout status statefulset/argocd-application-controller --timeout=300s
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  changed_when: false

- name: Does the seam differ from what is in Git?
  # `kubectl diff` exits 0 when nothing would change and 1 when something would. That exit code
  # is a better answer to "is this task going to do anything?" than parsing the words kubectl
  # prints afterwards, which is what the first version of this role did.
  #
  # --server-side matters here: these objects are CO-MANAGED. Argo CD's controller writes
  # transient metadata of its own (a refresh annotation, the operation field) and a client-side
  # diff counts anything absent from our file as a difference to remove. That produced a
  # "changed" on an unchanged file, nondeterministically, depending on whether a refresh
  # happened to be in flight.
  ansible.builtin.command: >-
    kubectl diff --server-side -f {{ repo_root }}/gitops/bootstrap/{{ item }}
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  loop:
    - projects.yaml
    - root-onprem.yaml
    # Added by ADR-0016. The seam is three objects now, and the ORDER still matters: an
    # Application referencing a missing project is rejected, so projects.yaml stays first.
    - root-tenants-onprem.yaml
  register: argocd_seam_diff
  changed_when: false
  # 0 = identical, 1 = differs. Anything else is a real error, and without this a broken
  # kubeconfig would read as "no differences" and the apply would be skipped silently.
  failed_when: argocd_seam_diff.rc not in [0, 1]

- name: A timestamp, and somewhere to put the evidence
  # Not the gathered-facts date, and not for style: that fact only exists if facts were
  # gathered, and `make onprem-argocd` runs --tags argocd, which skips the preflight play that
  # gathers them. The task would work on a full run and fail on exactly the run someone reaches
  # for when Argo CD is the broken thing - the one job this role exists to do.
  #
  # The directory is created here as well as in the gateway_api role, because that role is
  # skipped by the same tag. Fourth time for this class of bug: nothing in Ansible creates a
  # parent directory, and "it exists because another role made it" is a coincidence, not a
  # dependency.
  ansible.builtin.set_fact:
    seam_stamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
  run_once: true

- name: Make sure there is somewhere to write the evidence
  ansible.builtin.file:
    path: "{{ repo_root }}/.cache"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false

- name: Record WHAT differs, whenever something does
  # Added after the second unexplained occurrence, both times on the first run after the cluster
  # was restarted. The parking-lot entry said to capture the diff next time it happened; relying
  # on a human to remember that, during the one run where it is visible, is not a plan - the
  # apply fires in the same playbook and the evidence is gone.
  #
  # So the role keeps it. The file is the thing to read when this recurs; the printed form is
  # for whoever is watching the run.
  when: item.rc == 1
  ansible.builtin.copy:
    dest: "{{ repo_root }}/.cache/seam-diff-{{ item.item }}-{{ seam_stamp }}.diff"
    mode: "0644"
    content: |
      # {{ item.item }} differed from the live object at {{ seam_stamp }}
      # Context: {{ kube_context }}. This file is evidence for docs/parking-lot.md, not config.
      # Written by the argocd role because the apply below erases the difference immediately.
      {{ item.stdout }}
  loop: "{{ argocd_seam_diff.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false

- name: Show the difference while it is still visible
  when: item.rc == 1
  ansible.builtin.debug:
    msg: |
      {{ item.item }} differs from the live object. Saved to
      .cache/seam-diff-{{ item.item }}-{{ seam_stamp }}.diff

      {{ item.stdout | default('(kubectl diff printed nothing, which is itself the finding)', true) }}
  loop: "{{ argocd_seam_diff.results }}"
  loop_control:
    label: "{{ item.item }}"
  run_once: true

- name: Apply the seam - the AppProjects and the root Application
  # THE ONLY in-cluster objects Ansible applies besides the Helm release, and ADR-0009 says
  # nothing may be added here without amending it. Order matters: an Application referencing a
  # missing AppProject is rejected, so projects.yaml goes first - which is why this loops over
  # the diff results in order rather than over a directory.
  #
  # --server-side records which fields WE own and leaves the controller's alone, instead of
  # treating "not in my file" as "delete it". --force-conflicts takes ownership of the fields
  # the previous client-side applies claimed; without it, the first server-side apply of an
  # object that was applied client-side fails on every field.
  #
  # kubectl rather than a Kubernetes Ansible module on purpose: the module needs the python
  # kubernetes library on the workstation, and this role is the recovery path - it should depend
  # on as little as possible.
  ansible.builtin.command: >-
    kubectl apply --server-side --force-conflicts
    -f {{ repo_root }}/gitops/bootstrap/{{ item.item }}
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  loop: "{{ argocd_seam_diff.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 1
  register: argocd_seam
  changed_when: true

- name: Wait for the root Application to report Synced and Healthy
  # The real test of this role. Argo CD running is not the same as Argo CD reconciling: a wrong
  # repoURL, a project that forbids the destination, or a path that does not exist all leave a
  # perfectly healthy Argo CD managing nothing.
  ansible.builtin.command: >-
    kubectl --namespace argocd get application platform-onprem
    -o jsonpath='{.status.sync.status}/{.status.health.status}'
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    KUBECONFIG: "{{ kubeconfig_fetch_path }}"
  register: argocd_root_status
  until: argocd_root_status.stdout == 'Synced/Healthy'
  retries: 30
  delay: 10
  changed_when: false

- name: Report
  ansible.builtin.debug:
    msg: |
      Argo CD chart {{ argocd_chart_version }}, root Application platform-onprem: {{ argocd_root_status.stdout }}

      UI:        make argocd-ui          (port-forward to http://localhost:8080)
                 http, not https - server.insecure is on, see the values file
      Password:  make argocd-password    (from the Secret the chart generated - not in Git)

      From here, nothing in this cluster is installed by hand. Adding a component means adding
      a file to gitops/clusters/onprem/platform/ and pushing it.
  run_once: true
