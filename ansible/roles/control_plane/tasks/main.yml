---
# control_plane: turn one prepared machine into a Kubernetes control plane.
#
# Idempotency here is not cosmetic. `kubeadm init` on an already-initialised node fails at
# preflight, and the tempting fix - `kubeadm reset` first - would destroy etcd and therefore the
# cluster on every run. So the whole role is gated on one file: /etc/kubernetes/admin.conf exists
# if and only if this node has been initialised.

# ---------------------------------------------------------------- etcd encryption at rest
#
# These four tasks run BEFORE kubeadm init, and the ordering is load-bearing: the rendered
# kubeadm config tells the API server to read /etc/kubernetes/enc/encryption-config.yaml, and an
# API server pointed at a file that does not exist does not warn - it refuses to start. On a
# fresh node that means `kubeadm init` itself times out waiting for a control plane that will
# never come up, with the real reason three layers down in the kubelet's logs.
#
# Doing it here also means a FRESH cluster is encrypted from its first write, so there is nothing
# to re-encrypt. Only an already-running cluster needs `make etcd-reencrypt`.

- name: Make sure the encryption key directory exists
  ansible.builtin.file:
    path: /etc/kubernetes/enc
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  tags: [config, etcd-encryption]

- name: Generate the etcd encryption key, once and only once
  # `creates:` is the whole safety property of this task. Regenerating this key would leave every
  # Secret already in etcd encrypted under a key nobody has - unreadable, permanently, and the
  # symptom is the API server returning errors for Secrets that plainly exist.
  #
  # 32 bytes because that is what aescbc, aesgcm and secretbox all require. A key of any other
  # length is rejected by the API server at startup, which is the one failure here that is loud.
  # `umask 077` before the redirect, because the shell creates the file and `shell:` has no mode
  # parameter - so without it the key lands at whatever the login umask gives, which on this
  # image is 0644. The key that decrypts every Secret in etcd, world-readable.
  #
  # Found by running these tasks for real against a temp directory rather than by reading them:
  # the check-mode failure that prompted the fix above never created a file, so it could not have
  # shown this. Two bugs in the same five lines, and only one of them was visible from the output
  # of the run that failed.
  ansible.builtin.shell:
    cmd: set -o pipefail && umask 077 && head -c 32 /dev/urandom | base64 -w0 > /etc/kubernetes/enc/key1.b64
    executable: /bin/bash
    creates: /etc/kubernetes/enc/key1.b64
  become: true
  tags: [config, etcd-encryption]

- name: Enforce the key file's permissions
  # Separate from the creation, and not redundant. The umask above protects the file at the moment
  # it is written; this protects it on every run afterwards, including a file created by an
  # earlier version of this role, restored from somewhere, or touched by hand.
  #
  # The directory is already 0700 root-owned, so a 0644 key is not actually readable by anyone -
  # but that is the directory's doing, not the file's. A key whose protection depends on its
  # parent's mode is one `chmod 755` away from being readable, and nothing would report it.
  ansible.builtin.file:
    path: /etc/kubernetes/enc/key1.b64
    owner: root
    group: root
    mode: "0600"
    state: file
  become: true
  # Under --check the file may not exist yet, and `file: state=file` fails on a missing path -
  # which would reintroduce exactly the check-mode breakage the next task exists to prevent.
  when: not ansible_check_mode
  tags: [config, etcd-encryption]

- name: Does the key file exist yet?
  # This stat exists because `make onprem-check` failed on the first attempt, and what it caught
  # was this role rather than the cluster.
  #
  # Under --check the two tasks above report "changed" and change nothing - that is what check
  # mode IS - so the directory and the key do not appear, and the slurp below then failed on a
  # file that would have existed in a real run. A preview tool that fails tells you nothing about
  # the real run, and worse, it looks like the real run would fail too.
  #
  # Gating on the file's ACTUAL state rather than on ansible_check_mode handles both cases with
  # one condition: in a real run the key has just been created and everything below proceeds; in
  # check mode on a cluster that has no key yet, there is genuinely nothing to read back and the
  # chain skips. On any later check run the key exists, so the validation and the template diff
  # are fully previewed.
  ansible.builtin.stat:
    path: /etc/kubernetes/enc/key1.b64
  become: true
  register: cp_enc_key_stat
  tags: [config, etcd-encryption]

- name: Say why the encryption tasks are being skipped
  when: not cp_enc_key_stat.stat.exists
  ansible.builtin.debug:
    msg: >-
      /etc/kubernetes/enc/key1.b64 does not exist yet, so the key cannot be read back, validated
      or rendered into an EncryptionConfiguration. Under --check that is expected: the task that
      creates it did not run. A real `make onprem-up` creates it and then does all three.
  tags: [config, etcd-encryption]

- name: Read the key back and check its length
  # Read rather than remembered. A truncated or hand-edited key file produces an API server that
  # will not start, and finding that out here - with a number - beats finding it out from a
  # control plane that is down.
  when: cp_enc_key_stat.stat.exists
  ansible.builtin.slurp:
    src: /etc/kubernetes/enc/key1.b64
  become: true
  register: cp_enc_key
  no_log: true
  tags: [config, etcd-encryption]

- name: The encryption key must be exactly 32 bytes
  # Checked as 44 base64 CHARACTERS rather than by decoding to 32 bytes, deliberately:
  # Ansible's b64decode returns a str and decodes as UTF-8, so running it over 32 random bytes
  # raises a UnicodeDecodeError roughly 99.9% of the time. The assertion would then fail on a
  # perfectly good key, which is a worse outcome than not checking - it would send someone
  # deleting the one file they must not delete.
  #
  # 32 bytes is always exactly 44 base64 characters including the single '=' pad.
  when: cp_enc_key_stat.stat.exists
  ansible.builtin.assert:
    that:
      - (cp_enc_key.content | b64decode | trim | length) == 44
    fail_msg: >-
      /etc/kubernetes/enc/key1.b64 does not decode to 32 bytes. The API server will refuse to
      start with this key. If this file was hand-edited, and NO Secret has been written since,
      it is safe to delete it and re-run. If Secrets have been written, deleting it makes them
      unreadable - restore the original first.
    success_msg: "encryption key is 32 bytes"
  tags: [config, etcd-encryption]

- name: Render the EncryptionConfiguration
  when: cp_enc_key_stat.stat.exists
  ansible.builtin.template:
    src: encryption-config.yaml.j2
    dest: /etc/kubernetes/enc/encryption-config.yaml
    owner: root
    group: root
    mode: "0600"
  vars:
    etcd_encryption_key: "{{ cp_enc_key.content | b64decode | trim }}"
  become: true
  # The key is interpolated into this file, so a verbose run would otherwise print it.
  no_log: true
  tags: [config, etcd-encryption]

- name: Make sure the kubeadm config directory exists
  # `template` does not create parent directories, and /etc/kubernetes/kubeadm is ours - the
  # kubeadm packages create /etc/kubernetes and /etc/kubernetes/manifests, not this.
  #
  # This task is missing from the Module 02 runbook's history because the directory was made
  # by hand there, with `sudo mkdir -p`, before the heredoc. That hand-made directory then
  # survived on the existing cluster, so the role passed every run against it and could only
  # fail on a node that had never been touched by hand. Which is precisely what the
  # destroy-and-rebuild gate is for: the bugs that hide in the difference between a machine
  # you built and a machine you fixed.
  ansible.builtin.file:
    path: /etc/kubernetes/kubeadm
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  tags: [config]

- name: Render the kubeadm configuration
  # The config is a template, not a copy, and every value that could drift comes from
  # nodes.json via the inventory (ADR-0008). Rendering it is safe on an initialised cluster:
  # kubeadm only reads it during init and upgrade.
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm/init.yaml
    owner: root
    group: root
    mode: "0600"
  become: true
  tags: [config]

- name: Validate the rendered configuration
  # Cheap, and it catches a misspelled field before init rather than during it. It does NOT
  # catch a config that is missing a document - Module 02 learned that the hard way - which is
  # why the template is rendered from one source rather than assembled.
  ansible.builtin.command: kubeadm config validate --config /etc/kubernetes/kubeadm/init.yaml
  become: true
  changed_when: false
  tags: [config]

- name: Has this node already been initialised?
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  become: true
  register: cp_admin_conf

- name: Initialise the control plane
  when: not cp_admin_conf.stat.exists
  block:
    - name: Pre-pull the control-plane images
      # Separate from init so that a slow or broken registry fails as "cannot pull images"
      # rather than as "init timed out waiting for the kubelet".
      ansible.builtin.command: kubeadm config images pull --config /etc/kubernetes/kubeadm/init.yaml
      become: true
      changed_when: true

    - name: kubeadm init
      ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm/init.yaml
      become: true
      register: cp_init
      changed_when: true

    - name: Keep the init output on the node
      # It records the phases that ran and the certificate hashes. Worth having when something
      # is wrong weeks later. The join token inside it expires in 24 hours, so this is not a
      # durable credential - but it is still not something to copy into Git.
      ansible.builtin.copy:
        content: "{{ cp_init.stdout }}\n"
        dest: /root/kubeadm-init.log
        owner: root
        group: root
        mode: "0600"
      become: true

- name: Wait for the API server to report ready
  # `kubeadm init` returning is not the same as the API server being usable: the static pods
  # are still settling. Everything after this talks to the API, so wait here once rather than
  # retrying in five later tasks.
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /readyz
  become: true
  register: cp_readyz
  until: cp_readyz.rc == 0 and 'ok' in cp_readyz.stdout
  retries: 30
  delay: 5
  changed_when: false

- name: Make sure the workstation has a ~/.kube directory
  # Same class of bug as the one above, one machine over. It exists on this workstation only
  # because Module 02 created it by hand, so a fresh clone on a fresh machine would hit it -
  # and that is the claim the roadmap makes about this repository.
  ansible.builtin.file:
    path: "{{ kubeconfig_fetch_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Fetch the admin kubeconfig to the workstation
  # PRISTINE. Nothing may modify this file afterwards.
  #
  # `fetch` is idempotent by comparing the remote checksum against the local copy - but only
  # if the local copy is still a copy. An earlier version of this role renamed the kubectl
  # context inside this very file, so every subsequent run found a local file that no longer
  # matched the remote one and re-downloaded it, reporting changed forever. Making the rename
  # task report "unchanged" did not help, because the problem was not the report: it was that
  # the task mutated another task's idempotency marker.
  #
  # The lesson generalises. A file that a later step edits in place cannot also be the thing
  # an earlier step compares against.
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_fetch_path }}"
    flat: true
  become: true

- name: Merge it into the workstation's kubeconfig under a readable context name
  # One task does the renaming and the merging, in a temporary file, and reports changed only
  # when the real kubeconfig actually moved. The fetched copy is never touched.
  #
  # Why rename at all: kubernetes-admin@onprem sitting beside
  # gke_shopverse-lab_asia-south1-a_shopverse-lab is how people run the wrong command against
  # the wrong cluster, and one of those two costs money.
  #
  # Why delete before merging: a rebuilt cluster has a NEW CA, so a stale context does not
  # merely go out of date - it fails TLS verification in a way that reads like a network
  # problem. kubectl's merge lets the FIRST file win for a duplicate name, so the old entries
  # have to go before the merge rather than after.
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      umask 077
      main="$HOME/.kube/config"
      mkdir -p "$HOME/.kube"
      touch "$main"
      before=$(sha256sum < "$main")

      # Normalise the context name in a COPY, never in the fetched file.
      incoming=$(mktemp)
      trap 'rm -f "$incoming" "${merged:-}"' EXIT
      cp {{ kubeconfig_fetch_path }} "$incoming"
      kubectl --kubeconfig "$incoming" \
        config rename-context kubernetes-admin@{{ cluster_name }} {{ kube_context }} >/dev/null 2>&1 || true

      kubectl --kubeconfig "$main" config delete-context {{ kube_context }} >/dev/null 2>&1 || true
      kubectl --kubeconfig "$main" config delete-cluster {{ cluster_name }} >/dev/null 2>&1 || true
      kubectl --kubeconfig "$main" config delete-user kubernetes-admin      >/dev/null 2>&1 || true

      merged=$(mktemp)
      KUBECONFIG="$main:$incoming" kubectl config view --flatten > "$merged"
      cp "$merged" "$main"
      kubectl --kubeconfig "$main" config use-context {{ kube_context }} >/dev/null

      after=$(sha256sum < "$main")
      [ "$before" = "$after" ] && echo UNCHANGED || echo UPDATED
  delegate_to: localhost
  become: false
  register: cp_merge
  changed_when: "'UPDATED' in cp_merge.stdout"

- name: Report
  ansible.builtin.debug:
    msg: >-
      Control plane ready at {{ control_plane_endpoint }}.
      kubectl context: {{ kube_context }}
