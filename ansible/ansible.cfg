# Ansible configuration for this repository.
#
# Used via ANSIBLE_CONFIG=ansible/ansible.cfg from the repo root (see the Makefile).
#
# The paths below are relative to THIS FILE's directory, not to the current directory.
# Ansible resolves relative config paths against the config file's location, so
# "ansible/inventory/nodes.py" here would be looked for at ansible/ansible/inventory/nodes.py -
# and the only symptom is "No inventory was parsed, only implicit localhost is available",
# followed by a confusing "role not found".

[defaults]
inventory          = inventory/nodes.py
roles_path         = roles
remote_user        = sagar
host_key_checking  = False
# The nodes regenerate their SSH host keys on first boot (the image is sealed), so a rebuilt
# node always presents a new key. Verifying against a remembered one would fail on every
# rebuild - which is the normal case here, not the exception.

stdout_callback    = yaml
# Show the task that changed something and nothing else. The point of running twice is to read
# "changed=0" at the end, and that is hard in a wall of green.
display_skipped_hosts = False
any_errors_fatal   = True
# A failed assertion on one node means the image is wrong on all of them. Carrying on to
# half-build a cluster wastes time and produces a confusing end state.

interpreter_python = /usr/bin/python3
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
