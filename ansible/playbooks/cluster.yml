---
# Build the on-prem Kubernetes cluster from three prepared machines.
#
#   make onprem-up       this playbook
#   make onprem-check    --check --diff, changes nothing
#   make onprem-config   re-render the kubeadm config only
#
# Everything Module 02 did by hand, in the order it was done by hand, and for the same reasons.
# The runbook docs/runbooks/cluster-bootstrap.md explains WHY each step exists; this file is the
# executable form of it, and the two must not drift.
#
# The gate for Module 03: `terraform destroy` the nodes, `make onprem-vms`, run this, and get a
# working cluster with no manual steps - then run it again and see changed=0.

- name: Assert the image did its job
  hosts: all
  # gather_facts is off at the play level and done explicitly below, because fact gathering is
  # itself a connection: with it on, a node that is still booting fails at "Gathering Facts"
  # before anything gets a chance to wait for it.
  gather_facts: false
  pre_tasks:
    - name: Wait for every node to answer SSH
      # `make onprem-vms` after a host restart starts the domains and returns in about two
      # seconds, because terraform_data.verify only re-runs when the addresses change - so
      # nothing waits for a boot that takes around 25 seconds. Running this playbook straight
      # afterwards failed with "No route to host" on all three nodes, which reads like a broken
      # network rather than "ask again in a moment".
      #
      # wait_for_connection retries the connection itself rather than failing on the first
      # refusal, which is what makes this playbook safe to run at any moment: immediately after
      # starting the VMs, after a laptop restart, or mid-boot.
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Gather facts now that the nodes are up
      ansible.builtin.setup
  roles:
    - preflight
  tags: [preflight]

- name: Bootstrap the control plane
  hosts: control_plane
  gather_facts: false
  roles:
    - control_plane
  tags: [control-plane, config]

- name: Install the CNI
  # Before the workers join, so that a joining node finds a pod network already waiting and
  # goes Ready once rather than twice. Nothing breaks if the order is reversed - it is just
  # fewer state transitions to read.
  hosts: control_plane
  gather_facts: false
  roles:
    - cilium
  tags: [cni]

- name: Join the workers
  hosts: workers
  gather_facts: false
  # One at a time. With two workers it barely matters; the habit matters, because this same
  # playbook is what will eventually touch a cluster that has something running on it.
  serial: 1
  roles:
    - workers
  tags: [workers]

- name: Install Argo CD and hand it the seam
  # After the workers, because Argo CD needs somewhere to run that is not the tainted control
  # plane. Layer 2 of ADR-0002: installed by Ansible, and re-runnable precisely when Argo CD is
  # the broken thing. ADR-0009 defines what it is allowed to apply.
  hosts: control_plane
  gather_facts: false
  roles:
    - argocd
  tags: [argocd, gitops]

- name: Verify what was built
  hosts: control_plane
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Wait for the CNI agent on the newly joined workers
      ansible.builtin.command: >-
        kubectl --namespace kube-system rollout status daemonset/cilium --timeout=180s
      delegate_to: localhost
      become: false
      environment:
        KUBECONFIG: "{{ kubeconfig_fetch_path }}"
      changed_when: false

    - name: Every node Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=180s
      delegate_to: localhost
      become: false
      environment:
        KUBECONFIG: "{{ kubeconfig_fetch_path }}"
      changed_when: false

    - name: The cluster, as built
      # Plain `get nodes`, not custom-columns. ROLES is a column kubectl COMPUTES from every
      # node-role.kubernetes.io/* label it finds; there is no single label holding it, so
      # asking for one by name prints <none> for a correctly labelled node - which is exactly
      # what the first version of this task did.
      ansible.builtin.command: kubectl get nodes -o wide
      delegate_to: localhost
      become: false
      environment:
        KUBECONFIG: "{{ kubeconfig_fetch_path }}"
      register: final_nodes
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: |
          {{ final_nodes.stdout }}

          Next: make smoke
          If this was the second consecutive run, every task above should have reported
          ok rather than changed. Anything that says changed on a second run is a task
          that is not idempotent, and that is a bug to fix now rather than to live with.
