---
# Build the on-prem Kubernetes cluster from three prepared machines.
#
#   make onprem-up       this playbook
#   make onprem-check    --check --diff, changes nothing
#   make onprem-config   re-render the kubeadm config only
#
# Everything Module 02 did by hand, in the order it was done by hand, and for the same reasons.
# The runbook docs/runbooks/cluster-bootstrap.md explains WHY each step exists; this file is the
# executable form of it, and the two must not drift.
#
# The gate for Module 03: `terraform destroy` the nodes, `make onprem-vms`, run this, and get a
# working cluster with no manual steps - then run it again and see changed=0.

- name: Assert the image did its job
  hosts: all
  # gather_facts is off at the play level and done explicitly below, because fact gathering is
  # itself a connection: with it on, a node that is still booting fails at "Gathering Facts"
  # before anything gets a chance to wait for it.
  gather_facts: false
  pre_tasks:
    - name: Wait for every node to answer SSH
      # `make onprem-vms` after a host restart starts the domains and returns in about two
      # seconds, because terraform_data.verify only re-runs when the addresses change - so
      # nothing waits for a boot that takes around 25 seconds. Running this playbook straight
      # afterwards failed with "No route to host" on all three nodes, which reads like a broken
      # network rather than "ask again in a moment".
      #
      # wait_for_connection retries the connection itself rather than failing on the first
      # refusal, which is what makes this playbook safe to run at any moment: immediately after
      # starting the VMs, after a laptop restart, or mid-boot.
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Wait for the image scripts to finish, where they run at boot
      # A WAIT, NOT AN ASSERTION, and `make aws-wait` existing was not enough.
      #
      # On a cloud substrate the four image scripts run from cloud-init AFTER the instance
      # answers SSH (ADR-0025), so a node can be reachable and two minutes from being usable.
      # On 2026-11-05 all three spot instances were reclaimed, Terraform rebuilt them, and the
      # playbook ran 90 seconds later: preflight failed on aws-w02 with
      #
      #   sysctl: cannot stat /proc/sys/net/bridge/bridge-nf-call-iptables: No such file
      #
      # br_netfilter simply had not been loaded yet. That reads as a broken image rather than
      # as impatience - terraform/aws/variables.tf predicted it in writing when the marker was
      # added, and `make aws-wait` is the documented first step. The documented first step is
      # not a mechanism: it depends on somebody remembering it, and the one time it mattered
      # the sequence I handed over left it out.
      #
      # EMPTY ON-PREM, where Packer bakes the scripts into the image at build time - the VM
      # boots with br_netfilter already loaded and there is nothing to wait for. An empty
      # marker skips this, which is a different statement from a missing variable: both
      # inventories define it, and `make lint` enforces that they do.
      when: image_ready_marker | default('') | length > 0
      block:
        - name: Wait for the boot marker
          ansible.builtin.wait_for:
            path: "{{ image_ready_marker }}"
            timeout: 600
            sleep: 5
      rescue:
        - name: Say what cloud-init was doing when it ran out of time
          # The wait_for timeout says only that a file did not appear. The build log says what
          # the scripts were doing, which is the difference between "slow mirror" and "this
          # image cannot build".
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -uo pipefail
              echo "--- cloud-init status ---"
              cloud-init status --long 2>&1 || true
              echo "--- last 30 lines of /var/log/image-build.log ---"
              tail -30 /var/log/image-build.log 2>&1 || echo "(no image-build.log - the scripts never started)"
          become: true
          register: boot_log
          changed_when: false

        - name: Fail with the log rather than with the timeout
          ansible.builtin.fail:
            msg: |
              {{ inventory_hostname }} never created {{ image_ready_marker }} within 600s.

              {{ boot_log.stdout | default('(no output)') }}

    - name: Gather facts now that the nodes are up
      # The colon is not optional. `ansible.builtin.setup` without it is a bare scalar rather
      # than a mapping key, and YAML then reads the next line's "roles:" as a continuation -
      # so the error points at line 38 and talks about colons in unquoted values, several
      # lines below the actual mistake.
      ansible.builtin.setup:
  roles:
    - preflight
  tags: [preflight]

- name: Bootstrap the control plane
  hosts: control_plane
  gather_facts: false
  roles:
    - control_plane
  tags: [control-plane, config]

- name: Turn on encryption at rest for Secrets
  # Immediately after the control plane and before anything else uses the API server, because
  # this is the one play that deliberately RESTARTS it. Running it later would mean Cilium, Argo
  # CD or the tenant watching an API server that disappears for twenty seconds mid-playbook -
  # survivable, and pointless to find out about.
  #
  # On a fresh cluster it does nothing: kubeadm init already built an encrypted control plane
  # from the config the previous play rendered. On an existing one it rewrites the static pod
  # manifest, waits for an API server that has the flag, and restores the previous manifest if
  # one does not arrive.
  hosts: control_plane
  gather_facts: false
  roles:
    - etcd_encryption
  tags: [etcd-encryption, control-plane]

- name: Install the Gateway API CRDs
  # Before Cilium, not after. Cilium's gatewayAPI.enabled does nothing at all unless these
  # resource types already exist, and an operator that starts without them comes up cleanly with
  # Gateway support silently off (ADR-0012 Decision 2).
  hosts: control_plane
  gather_facts: false
  roles:
    - gateway_api
  tags: [gateway-api, cni]

- name: Install the CNI
  # Before the workers join, so that a joining node finds a pod network already waiting and
  # goes Ready once rather than twice. Nothing breaks if the order is reversed - it is just
  # fewer state transitions to read.
  hosts: control_plane
  gather_facts: false
  roles:
    - cilium
  tags: [cni]

- name: Remove kube-proxy
  # After Cilium, never before: removing kube-proxy while Cilium is still in
  # kubeProxyReplacement: false would leave nothing programming Services, including the ClusterIP
  # the API server is reached by. The role asserts Cilium's RUNNING config before deleting
  # anything, rather than trusting that the values file was applied (ADR-0012).
  hosts: all
  gather_facts: false
  roles:
    - kube_proxy_removal
  tags: [kube-proxy, cni]

- name: Join the workers
  hosts: workers
  gather_facts: false
  # One at a time. With two workers it barely matters; the habit matters, because this same
  # playbook is what will eventually touch a cluster that has something running on it.
  serial: 1
  roles:
    - workers
  tags: [workers]

- name: Install Argo CD and hand it the seam
  # After the workers, because Argo CD needs somewhere to run that is not the tainted control
  # plane. Layer 2 of ADR-0002: installed by Ansible, and re-runnable precisely when Argo CD is
  # the broken thing. ADR-0009 defines what it is allowed to apply.
  hosts: control_plane
  gather_facts: false
  roles:
    - argocd
  tags: [argocd, gitops]

- name: Verify what was built
  hosts: control_plane
  gather_facts: false
  tags: [verify]
  tasks:
    # EVERY kubectl IN THIS PLAY USES cluster_kubeconfig, NOT kubeconfig_fetch_path.
    #
    # The fetched admin.conf names controlPlaneEndpoint, which on a cloud substrate is an
    # address this workstation cannot route to. These three tasks were the FOURTH place that
    # mistake appeared - after the argocd role, then gateway_api, cilium and kube_proxy_removal
    # together - because each fix was applied to the files in front of me rather than to
    # everything that runs kubectl on localhost. `make lint` now enforces the rule instead of
    # relying on me to grep.
    - name: Wait for the CNI agent on the newly joined workers
      ansible.builtin.command: >-
        kubectl --namespace kube-system rollout status daemonset/cilium --timeout=180s
      delegate_to: localhost
      become: false
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig }}"
      changed_when: false

    - name: Every node Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=180s
      delegate_to: localhost
      become: false
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig }}"
      changed_when: false

    - name: The cluster, as built
      # Plain `get nodes`, not custom-columns. ROLES is a column kubectl COMPUTES from every
      # node-role.kubernetes.io/* label it finds; there is no single label holding it, so
      # asking for one by name prints <none> for a correctly labelled node - which is exactly
      # what the first version of this task did.
      ansible.builtin.command: kubectl get nodes -o wide
      delegate_to: localhost
      become: false
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig }}"
      register: final_nodes
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: |
          {{ final_nodes.stdout }}

          Next: make smoke
          If this was the second consecutive run, every task above should have reported
          ok rather than changed. Anything that says changed on a second run is a task
          that is not idempotent, and that is a bug to fix now rather than to live with.
